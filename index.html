<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grazie</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Georgia',serif;background:#0a0a0f;color:#fff;min-height:100vh;overflow-x:hidden}
#laser-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.view{display:none;position:relative;z-index:10;min-height:100vh}
.view.active{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
#landing{text-align:center}
#landing h1{font-size:clamp(1.8rem,5vw,3rem);font-weight:300;letter-spacing:.15em;color:#fff;margin-bottom:.5rem;text-transform:uppercase}
#landing p.sub{font-size:1rem;color:rgba(255,255,255,.5);letter-spacing:.08em;margin-bottom:2.5rem;font-family:sans-serif}
.auth-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:2rem;max-width:380px;width:100%;backdrop-filter:blur(10px);margin-bottom:1.5rem}
.auth-box label{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:.4rem;font-family:sans-serif}
.auth-box input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:.95rem;padding:.65rem .8rem;outline:none;transition:border-color .2s;font-family:sans-serif;margin-bottom:1rem}
.auth-box input:focus{border-color:rgba(255,255,255,.4)}
.auth-box input::placeholder{color:rgba(255,255,255,.2)}
.btn-enter{width:100%;padding:.85rem;background:rgba(255,255,255,.9);color:#0a0a0f;border:none;border-radius:8px;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:sans-serif;transition:background .2s}
.btn-enter:hover{background:#fff}
.error-msg{color:#ff6b8a;font-size:.8rem;margin-top:.8rem;font-family:sans-serif;min-height:1.2em}
#dump-section{width:100%;max-width:760px;margin-top:2rem}
#dump-section h2{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.35);font-family:sans-serif;font-weight:400;margin-bottom:1rem;text-align:center}
.dump-upload-area{border:1px dashed rgba(255,255,255,.18);border-radius:12px;padding:1.2rem;text-align:center;cursor:pointer;color:rgba(255,255,255,.3);font-family:sans-serif;font-size:.82rem;transition:all .2s;margin-bottom:1rem}
.dump-upload-area:hover{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.6)}
.dump-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.dump-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
.dump-item img{width:100%;height:100%;object-fit:cover;cursor:pointer;transition:transform .3s;display:block}
.dump-item:hover img{transform:scale(1.04)}
.dump-item .dl-btn{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.6);border:none;border-radius:5px;color:#fff;cursor:pointer;padding:3px 8px;font-size:.68rem;font-family:sans-serif}
.dump-item .rm-btn{position:absolute;top:5px;right:5px;background:rgba(180,0,0,.7);border:none;border-radius:50%;color:#fff;cursor:pointer;width:20px;height:20px;font-size:.75rem;display:none;align-items:center;justify-content:center}
.dump-item:hover .rm-btn{display:flex}
#personal-view{padding:0;align-items:stretch;justify-content:flex-start;overflow:hidden;position:relative}
#park-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.personal-scroll{position:relative;z-index:10;padding:3rem 2rem 4rem;display:flex;flex-direction:column;align-items:center;width:100%;overflow-y:auto;min-height:100vh}
.personal-wrap{max-width:700px;width:100%;background:rgba(255,248,235,.82);backdrop-filter:blur(12px);border-radius:20px;padding:2.5rem;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.personal-name{font-size:clamp(1.4rem,4vw,2.2rem);font-weight:300;letter-spacing:.12em;text-transform:uppercase;color:#2a1a0a;margin-bottom:.4rem}
.personal-divider{width:40px;height:1px;background:rgba(80,40,0,.2);margin:1rem 0 1.8rem}
.personal-letter{font-size:1.05rem;line-height:1.9;color:#3a2010;white-space:pre-wrap;margin-bottom:1.5rem;font-style:italic}
.photo-slideshow{position:relative;width:100%;margin-bottom:2rem;border-radius:16px;overflow:hidden;background:#e8d8c0;height:340px}
.photo-slideshow-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease;will-change:opacity}
.photo-slideshow-img.active{opacity:1;z-index:1}
.slideshow-controls{position:absolute;bottom:12px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px;z-index:5}
.slideshow-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.6);cursor:pointer;padding:0;transition:all .3s;flex-shrink:0}
.slideshow-dot.active{background:#fff;transform:scale(1.35);border-color:#fff}
.slideshow-pause{background:rgba(0,0,0,.4);border:none;border-radius:20px;color:#fff;cursor:pointer;padding:4px 12px;font-size:.7rem;font-family:sans-serif;backdrop-filter:blur(6px);transition:background .2s}
.slideshow-pause:hover{background:rgba(0,0,0,.65)}
.slideshow-dl{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.45);border:none;border-radius:6px;color:#fff;cursor:pointer;padding:5px 11px;font-size:.72rem;font-family:sans-serif;backdrop-filter:blur(6px);z-index:5;transition:background .2s}
.slideshow-dl:hover{background:rgba(0,0,0,.7)}
.slideshow-open{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.45);border:none;border-radius:6px;color:#fff;cursor:pointer;padding:5px 11px;font-size:.72rem;font-family:sans-serif;backdrop-filter:blur(6px);z-index:5;transition:background .2s}
.slideshow-open:hover{background:rgba(0,0,0,.7)}
.letter-side-layout{display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:start;margin-bottom:2rem}
.letter-side-layout .personal-letter{margin-bottom:0}
.side-photos{display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:420px}
.side-photo-item{width:170px;height:170px;flex:0 0 170px;border-radius:10px;overflow:hidden;border:1px solid rgba(80,40,0,.12);background:#e8d8c0;cursor:pointer;position:relative;transition:transform .2s}
.side-photo-item:hover{transform:scale(1.03)}
.side-photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.side-photo-item .dl-btn{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.45);border:none;border-radius:5px;color:#fff;cursor:pointer;padding:3px 7px;font-size:.68rem;font-family:sans-serif;opacity:0;transition:opacity .2s}
.side-photo-item:hover .dl-btn{opacity:1}
.group-section{margin-top:2.5rem;padding-top:2rem;border-top:1px solid rgba(80,40,0,.12)}
.group-section-title{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(80,40,0,.35);font-family:sans-serif;margin-bottom:1.5rem}
.group-collective-letter{background:rgba(255,245,220,.8);border:1px solid rgba(80,40,0,.1);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.group-collective-letter h3{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(80,40,0,.4);font-family:sans-serif;margin-bottom:.8rem}
.group-collective-letter p{font-size:1rem;line-height:1.85;color:#3a2010;font-style:italic;white-space:pre-wrap}
.group-members-list{display:flex;flex-direction:column;gap:1rem}
.group-member-card{background:rgba(255,245,220,.7);border:1px solid rgba(80,40,0,.1);border-radius:10px;padding:1.2rem;cursor:pointer;transition:all .2s;scroll-margin-top:2rem}
.group-member-card:hover{background:rgba(255,245,220,.95)}
.group-member-card.highlight{border-color:rgba(180,100,20,.35);background:rgba(255,235,180,.6)}
.group-member-card .gm-name{font-size:1rem;color:#2a1a0a;margin-bottom:.3rem;font-family:sans-serif}
.group-member-card .gm-preview{font-size:.88rem;color:rgba(60,30,10,.5);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back-btn{background:rgba(255,245,220,.6);border:1px solid rgba(80,40,0,.2);color:rgba(60,30,10,.5);padding:.5rem 1.2rem;border-radius:6px;cursor:pointer;font-family:sans-serif;font-size:.8rem;transition:all .2s;margin-top:2rem}
.back-btn:hover{background:rgba(255,235,180,.8);color:#2a1a0a}
#admin-view{align-items:flex-start;justify-content:flex-start;padding:2rem}
.admin-wrap{max-width:960px;width:100%}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:.5rem}
.admin-tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.tab-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-family:sans-serif;font-size:.78rem;transition:all .2s}
.tab-btn.active{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}
.friends-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:1.5rem}
.friend-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:1rem;cursor:pointer;transition:all .2s}
.friend-card:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25)}
.friend-card .fn{font-size:.95rem;color:#fff;font-family:sans-serif;margin-bottom:.25rem}
.friend-card .fmeta{font-size:.7rem;color:rgba(255,255,255,.35);font-family:sans-serif;margin-top:.2rem}
.add-btn{width:100%;padding:.7rem;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.18);border-radius:10px;color:rgba(255,255,255,.45);cursor:pointer;font-family:sans-serif;font-size:.82rem;transition:all .2s}
.add-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.admin-form{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:1.5rem}
.form-row{margin-bottom:1.1rem}
.form-row label{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:.35rem;font-family:sans-serif}
.form-row input,.form-row textarea,.form-row select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;font-size:.92rem;padding:.6rem .75rem;outline:none;transition:border-color .2s;font-family:Georgia,serif}
.form-row input,.form-row select{font-family:sans-serif}
.form-row select option{background:#1a1a2e;color:#fff}
.form-row textarea{min-height:130px;resize:vertical;line-height:1.6}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:rgba(255,255,255,.35)}
.form-row input::placeholder,.form-row textarea::placeholder{color:rgba(255,255,255,.2)}
.form-row .hint{font-size:.7rem;color:rgba(255,255,255,.25);font-family:sans-serif;margin-top:.3rem}
.photo-upload-area{border:1px dashed rgba(255,255,255,.18);border-radius:8px;padding:1.2rem;text-align:center;cursor:pointer;color:rgba(255,255,255,.3);font-family:sans-serif;font-size:.82rem;transition:all .2s}
.photo-upload-area:hover{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.6)}
.photo-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:.8rem}
.thumb-wrap{position:relative}
.photo-thumb{width:68px;height:68px;border-radius:6px;object-fit:cover;border:1px solid rgba(255,255,255,.1);display:block;background:rgba(255,255,255,.06)}
.thumb-wrap .rm{position:absolute;top:-5px;right:-5px;background:#b00;border:none;border-radius:50%;color:#fff;width:17px;height:17px;font-size:.62rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.form-actions{display:flex;gap:.7rem;margin-top:1.4rem;flex-wrap:wrap}
.btn-save{flex:1;min-width:100px;padding:.72rem;background:rgba(255,255,255,.88);color:#0a0a0f;border:none;border-radius:8px;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:sans-serif}
.btn-save:hover{background:#fff}
.btn-preview{flex:1;min-width:100px;padding:.72rem;background:transparent;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.7);border-radius:8px;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:sans-serif}
.btn-preview:hover{border-color:rgba(255,255,255,.5);color:#fff}
.btn-del{padding:.72rem 1rem;background:rgba(255,60,60,.1);border:1px solid rgba(255,60,60,.22);color:rgba(255,110,110,.8);border-radius:8px;font-size:.82rem;cursor:pointer;font-family:sans-serif}
.groups-admin-list{margin-bottom:1.2rem}
.group-admin-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:1.2rem;margin-bottom:1rem}
.group-admin-card .ga-header{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem}
.group-admin-card .ga-header input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-size:1rem;padding:.5rem .7rem;outline:none;font-family:sans-serif}
.group-admin-card .rm-g{background:rgba(255,60,60,.1);border:1px solid rgba(255,60,60,.2);color:rgba(255,110,110,.8);border-radius:6px;padding:.35rem .7rem;cursor:pointer;font-size:.75rem;font-family:sans-serif}
.group-admin-card label{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);font-family:sans-serif;display:block;margin-bottom:.4rem}
.group-admin-card textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#fff;font-size:.88rem;padding:.5rem .7rem;outline:none;font-family:Georgia,serif;min-height:80px;resize:vertical;line-height:1.6}
.group-admin-card textarea::placeholder{color:rgba(255,255,255,.2)}
.group-members-tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.member-tag{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);padding:.25rem .6rem;border-radius:12px;font-size:.75rem;font-family:sans-serif}
.admin-access{position:fixed;top:1rem;right:1rem;z-index:200}
.admin-link{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.3);padding:.32rem .65rem;border-radius:6px;cursor:pointer;font-family:monospace;font-size:.68rem;transition:all .2s}
.admin-link:hover{color:rgba(255,255,255,.7)}
.admin-pw-box{position:fixed;top:3.2rem;right:1rem;background:#111;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:.9rem;z-index:200;display:none}
.admin-pw-box input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;padding:.38rem .55rem;font-family:monospace;outline:none;width:160px}
.admin-pw-box button{margin-top:.45rem;width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:.32rem;border-radius:6px;cursor:pointer;font-family:sans-serif;font-size:.78rem}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);color:#fff;padding:.55rem 1.4rem;border-radius:20px;font-family:sans-serif;font-size:.82rem;z-index:700;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
input[type="file"]{display:none}
.t-overlay{position:fixed;inset:0;z-index:800;pointer-events:all;opacity:0;transition:opacity .55s ease}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:550;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:82vh;border-radius:8px;object-fit:contain}
.lightbox .lb-dl{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:.48rem 1.3rem;border-radius:8px;cursor:pointer;font-family:sans-serif;font-size:.82rem}
.lightbox .lb-close{position:absolute;top:1.2rem;right:1.5rem;background:none;border:none;color:rgba(255,255,255,.45);font-size:1.8rem;cursor:pointer}
</style>
</head>
<body>
<canvas id="laser-canvas"></canvas>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" onclick="closeLB(event)">
  <button class="lb-close" onclick="closeLB()">×</button>
  <img id="lb-img" src="">
  <button class="lb-dl" onclick="dlLB()">Scarica originale</button>
</div>
<div class="admin-access">
  <button class="admin-link" onclick="toggleAdminPw()">admin</button>
  <div class="admin-pw-box" id="admin-pw-box">
    <input type="password" id="admin-pw-input" placeholder="password" onkeydown="if(event.key==='Enter')checkAdmin()">
    <button onclick="checkAdmin()">Entra</button>
  </div>
</div>

<!-- LANDING -->
<div class="view active" id="landing">
  <h1>Grazie</h1>
  <p class="sub">per esserci stati — sempre</p>
  <div class="auth-box">
    <label>Il tuo nome</label>
    <input type="text" id="auth-name" placeholder="Nome Cognome" autocomplete="off">
    <label>Parola chiave</label>
    <input type="password" id="auth-pass" placeholder="la tua parola chiave" autocomplete="off" onkeydown="if(event.key==='Enter')enterCode()">
    <button class="btn-enter" onclick="enterCode()">Accedi al tuo messaggio</button>
    <div class="error-msg" id="auth-error"></div>
  </div>
  <div id="dump-section">
    <h2>Picture Dump</h2>
    <div class="dump-upload-area" onclick="document.getElementById('dump-input').click()">Carica le tue foto — alta qualità, nessuna compressione</div>
    <input type="file" id="dump-input" accept="image/*" multiple onchange="handleDumpUpload(this)">
    <div class="dump-grid" id="dump-grid"></div>
  </div>
</div>

<!-- PERSONAL VIEW -->
<div class="view" id="personal-view">
  <canvas id="park-canvas"></canvas>
  <div class="personal-scroll">
    <div class="personal-wrap">
      <div class="personal-name" id="pv-name"></div>
      <div class="personal-divider"></div>
      <div id="pv-content"></div>
      <div id="pv-group-section"></div>
      <button class="back-btn" onclick="smoothTo('landing','dark')">← indietro</button>
    </div>
  </div>
</div>

<!-- ADMIN VIEW -->
<div class="view" id="admin-view">
  <div class="admin-wrap">
    <div class="admin-header">
      <div style="display:flex;align-items:center;gap:1rem">
        <span style="font-size:1.2rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.8);font-family:sans-serif">Dashboard</span>
        <button onclick="smoothTo('landing','dark')" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);padding:.3rem .8rem;border-radius:6px;cursor:pointer;font-family:sans-serif;font-size:.75rem">← Home</button>
      </div>
      <div class="admin-tabs">
        <button class="tab-btn active" id="tb-list" onclick="showTab('list')">Amici</button>
        <button class="tab-btn" id="tb-form" onclick="showTab('form')">+ Nuovo</button>
        <button class="tab-btn" id="tb-groups" onclick="showTab('groups')">Gruppi</button>
        <button class="tab-btn" id="tb-dump" onclick="showTab('dump')">Picture Dump</button>
      </div>
    </div>
    <div id="tab-list">
      <div class="friends-grid" id="friends-grid"></div>
      <button class="add-btn" onclick="newFriend()">+ Aggiungi amico</button>
    </div>
    <div id="tab-form" style="display:none">
      <div style="margin-bottom:1rem">
        <button onclick="showTab('list')" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);padding:.35rem .9rem;border-radius:6px;cursor:pointer;font-family:sans-serif;font-size:.78rem">← Lista amici</button>
      </div>
      <div class="admin-form">
        <div class="form-row"><label>Nome completo</label><input type="text" id="f-name" placeholder="es. Alessandro Rossi"></div>
        <div class="form-row">
          <label>Parola chiave (passkey)</label>
          <input type="text" id="f-passkey" placeholder="es. tramonto, margherita99, sole…">
          <div class="hint">Scegli una parola o frase da condividere privatamente con questa persona. Supporta accenti (à è ì ò ù é).</div>
        </div>
        <div class="form-row">
          <label>Gruppo (opzionale)</label>
          <select id="f-group"><option value="">Nessun gruppo</option></select>
        </div>
        <div class="form-row"><label>Lettera personale</label><textarea id="f-letter" placeholder="Scrivi il messaggio personale..."></textarea></div>
        <div class="form-row">
          <label>Foto (via Cloudinary)</label>
          <div class="photo-upload-area" onclick="document.getElementById('photo-input').click()">Clicca per caricare foto</div>
          <input type="file" id="photo-input" accept="image/*" multiple onchange="handlePhotos(this)">
          <div class="photo-thumbs" id="photo-thumbs"></div>
        </div>
        <div class="form-actions">
          <button class="btn-preview" onclick="previewFriend()">Anteprima</button>
          <button class="btn-save" onclick="saveFriend()">Salva</button>

// ===== GITHUB =====
function b64ToUtf8(b64){
  var bin=atob(b64.replace(/\n/g,''));
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function ghRead(path){
  var url='https://api.github.com/repos/'+GH_USER+'/'+GH_REPO+'/contents/'+path;
  return fetch(url,{headers:{Accept:'application/vnd.github.v3+json'},cache:'no-store'})
    .then(function(r){
      if(!r.ok) return null;
      return r.json().then(function(j){
        if(!j.content) return null;
        try{return JSON.parse(b64ToUtf8(j.content));}catch(e){return null;}
      });
    }).catch(function(){return null;});
}
function ghWrite(path,data){
  return fetch(VERCEL_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:path,data:data})})
    .then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t);});return r.json();});
}
function saveFriendsGH(){return ghWrite('data/friends.json',friends);}
function saveGroupsGH(){return ghWrite('data/groups.json',groups);}
function saveDumpGH(){return ghWrite('data/dump.json',dump);}
function loadAllData(){
  return Promise.all([ghRead('data/friends.json'),ghRead('data/groups.json'),ghRead('data/dump.json')])
    .then(function(res){
      friends=Array.isArray(res[0])?res[0]:[];
      groups=Array.isArray(res[1])?res[1]:[];
      dump=Array.isArray(res[2])?res[2]:[];
      renderDump();
    });
}

// ===== CLOUDINARY =====
function uploadToCloudinary(file){
  var fd=new FormData();fd.append('file',file);fd.append('upload_preset',CLD_PRESET);
  return fetch('https://api.cloudinary.com/v1_1/'+CLD_CLOUD+'/image/upload',{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(j){if(j.error)throw new Error(j.error.message);return j.secure_url;});
}

// ===== LASER =====
var LC=document.getElementById('laser-canvas'),lc=LC.getContext('2d');
var lcols=['#ff6ec7','#6ec7ff','#c7ff6e','#ffd06e','#c86eff','#6effcc','#ff6e6e'];
var lasers=[];

resizeLC();window.addEventListener('resize',resizeLC);
function mkL(){var h=Math.random()>.5;return{h:h,x:h?0:Math.random()*innerWidth,y:h?Math.random()*innerHeight:0,dx:h?(1+Math.random()*1.5):(Math.random()-.5)*.8,dy:h?(Math.random()-.5)*.8:(1+Math.random()*1.5),len:80+Math.random()*180,col:lcols[Math.floor(Math.random()*lcols.length)],alpha:.25+Math.random()*.45,w:1+Math.random()*2};}
for(var _i=0;_i<22;_i++) lasers.push(mkL());
function animL(){
  lc.clearRect(0,0,LC.width,LC.height);
  lasers.forEach(function(l,i){
    var g=lc.createLinearGradient(l.x,l.y,l.x+(l.h?l.len:0),l.y+(l.h?0:l.len));
    g.addColorStop(0,'transparent');g.addColorStop(.5,l.col+Math.floor(l.alpha*255).toString(16).padStart(2,'0'));g.addColorStop(1,'transparent');
    lc.strokeStyle=g;lc.lineWidth=l.w;lc.beginPath();lc.moveTo(l.x,l.y);lc.lineTo(l.x+(l.h?l.len:0),l.y+(l.h?0:l.len));lc.stroke();
    l.x+=l.dx;l.y+=l.dy;
    if(l.x>innerWidth+l.len||l.y>innerHeight+l.len||l.x<-l.len||l.y<-l.len) lasers[i]=mkL();
  });

}

// ===== PARCO TRAMONTO =====
function startPark(){
  var cc=document.getElementById('park-canvas');
  cc.width=innerWidth;cc.height=innerHeight;
  var ctx=cc.getContext('2d'),t=0;
  var leaves=[];
  for(var i=0;i<38;i++) leaves.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,size:4+Math.random()*8,rot:Math.random()*Math.PI*2,rotSpeed:(Math.random()-.5)*.04,vx:(Math.random()-.5)*.6,vy:.4+Math.random()*.8,col:['#c8440a','#e8820a','#d4a012','#8b3a0a','#c86010'][Math.floor(Math.random()*5)],alpha:.5+Math.random()*.5,swing:Math.random()*Math.PI*2,swingSpeed:.02+Math.random()*.02});
  function drawSky(W,H){var sky=ctx.createLinearGradient(0,0,0,H*.65);sky.addColorStop(0,'#1a0a2e');sky.addColorStop(.25,'#6b1a3a');sky.addColorStop(.5,'#d4430a');sky.addColorStop(.72,'#f09020');sky.addColorStop(.88,'#f8c060');sky.addColorStop(1,'#ffe8a0');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.65);var sunX=W*.62,sunY=H*.48;var sg=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,H*.25);sg.addColorStop(0,'rgba(255,240,120,.95)');sg.addColorStop(.15,'rgba(255,180,40,.7)');sg.addColorStop(.45,'rgba(240,100,20,.3)');sg.addColorStop(1,'rgba(100,20,60,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sunX,sunY,H*.25,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,252,180,.98)';ctx.beginPath();ctx.arc(sunX,sunY,H*.055,0,Math.PI*2);ctx.fill();}
  function drawGround(W,H){var gr=ctx.createLinearGradient(0,H*.6,0,H);gr.addColorStop(0,'#1a3a08');gr.addColorStop(.4,'#0d2204');gr.addColorStop(1,'#060f02');ctx.fillStyle=gr;ctx.fillRect(0,H*.62,W,H*.38);ctx.save();var path=ctx.createLinearGradient(0,H*.65,0,H);path.addColorStop(0,'rgba(180,140,80,.6)');path.addColorStop(1,'rgba(120,90,50,.4)');ctx.fillStyle=path;ctx.beginPath();ctx.moveTo(W*.42,H*.63);ctx.lineTo(W*.58,H*.63);ctx.lineTo(W*.72,H);ctx.lineTo(W*.28,H);ctx.closePath();ctx.fill();ctx.restore();}
  function drawTree(x,groundY,h,W,phase){var tw=h*.06;var tg=ctx.createLinearGradient(x-tw,groundY-h*.3,x+tw,groundY);tg.addColorStop(0,'#2a1200');tg.addColorStop(1,'#1a0a00');ctx.fillStyle=tg;ctx.beginPath();ctx.moveTo(x-tw,groundY);ctx.lineTo(x+tw,groundY);ctx.lineTo(x+tw*.5,groundY-h*.35);ctx.lineTo(x-tw*.5,groundY-h*.35);ctx.closePath();ctx.fill();var sway=Math.sin(t*.6+phase)*h*.012;var cx2=x+sway;var layers=[{dy:0,r:h*.38,col:'rgba(8,28,4,.92)'},{dy:-h*.15,r:h*.28,col:'rgba(10,35,5,.88)'},{dy:-h*.28,r:h*.18,col:'rgba(12,40,6,.82)'}];layers.forEach(function(l){var glowG=ctx.createRadialGradient(cx2,groundY-h*.4+l.dy,0,cx2,groundY-h*.4+l.dy,l.r);glowG.addColorStop(0,'rgba(220,100,10,.18)');glowG.addColorStop(.6,'rgba(180,60,0,.08)');glowG.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glowG;ctx.beginPath();ctx.arc(cx2,groundY-h*.4+l.dy,l.r*1.2,0,Math.PI*2);ctx.fill();ctx.fillStyle=l.col;ctx.beginPath();ctx.arc(cx2,groundY-h*.4+l.dy,l.r,0,Math.PI*2);ctx.fill();});}
  function draw(){
    var W=cc.width,H=cc.height;ctx.clearRect(0,0,W,H);drawSky(W,H);
    var fog=ctx.createLinearGradient(0,H*.55,0,H*.72);fog.addColorStop(0,'rgba(255,180,80,0)');fog.addColorStop(.5,'rgba(255,160,60,.18)');fog.addColorStop(1,'rgba(255,140,40,0)');ctx.fillStyle=fog;ctx.fillRect(0,H*.55,W,H*.2);
    drawGround(W,H);
    [.05,.12,.18,.28,.35,.72,.8,.88,.93,.98].forEach(function(bx,i){ctx.globalAlpha=.6+i*.02;drawTree(W*bx,H*.65,H*(.22+Math.sin(i)*.04),W,i*1.3);});
    ctx.globalAlpha=1;drawTree(W*.04,H*.98,H*.75,W,0);drawTree(W*.13,H*.96,H*.65,W,1.2);drawTree(W*.88,H*.97,H*.72,W,2.1);drawTree(W*.96,H*.95,H*.62,W,3.3);
    leaves.forEach(function(leaf){leaf.swing+=leaf.swingSpeed;leaf.x+=leaf.vx+Math.sin(leaf.swing)*.8;leaf.y+=leaf.vy;leaf.rot+=leaf.rotSpeed;if(leaf.y>H+20){leaf.y=-20;leaf.x=Math.random()*W;}ctx.save();ctx.translate(leaf.x,leaf.y);ctx.rotate(leaf.rot);ctx.globalAlpha=leaf.alpha;ctx.fillStyle=leaf.col;ctx.beginPath();ctx.ellipse(0,0,leaf.size,leaf.size*.5,0,0,Math.PI*2);ctx.fill();ctx.restore();});
    ctx.save();var refl=ctx.createLinearGradient(W*.42,H*.63,W*.58,H*.63);refl.addColorStop(0,'rgba(240,140,40,0)');refl.addColorStop(.5,'rgba(255,180,60,.25)');refl.addColorStop(1,'rgba(240,140,40,0)');ctx.fillStyle=refl;ctx.beginPath();ctx.moveTo(W*.44,H*.63);ctx.lineTo(W*.56,H*.63);ctx.lineTo(W*.68,H);ctx.lineTo(W*.32,H);ctx.closePath();ctx.fill();ctx.restore();
    t+=.012;parkAnim=requestAnimationFrame(draw);
  }
  draw();
}
function stopPark(){if(parkAnim){cancelAnimationFrame(parkAnim);parkAnim=null;}var cc=document.getElementById('park-canvas');if(cc)cc.getContext('2d').clearRect(0,0,cc.width,cc.height);}

// ===== TRANSIZIONI =====
function smoothTo(targetId,type,afterFn){
  var ov=document.createElement('div');ov.className='t-overlay';
  ov.style.background=type==='light'?'#fff':'#0a0a0f';
  document.body.appendChild(ov);
  requestAnimationFrame(function(){requestAnimationFrame(function(){ov.style.opacity='1';});});
  setTimeout(function(){
    if(afterFn)afterFn();else showView(targetId);
    setTimeout(function(){ov.style.opacity='0';setTimeout(function(){if(ov.parentNode)ov.parentNode.removeChild(ov);},600);},type==='light'?180:80);
  },500);
}

// ===== ACCESSO CON PASSKEY =====
function norm(s){return s.trim().toLowerCase().normalize('NFC').replace(/\s+/,' ');}
function enterCode(){
  var name=document.getElementById('auth-name').value;
  var pass=document.getElementById('auth-pass').value;
  document.getElementById('auth-error').textContent='';
  if(!name.trim()||!pass.trim()){document.getElementById('auth-error').textContent='Inserisci nome e parola chiave.';return;}
  var matched=null;
  for(var i=0;i<friends.length;i++){
    var f=friends[i];
    if(norm(f.name)===norm(name) && f.passkey && norm(f.passkey)===norm(pass)){matched=f;break;}
  }
  if(!matched){document.getElementById('auth-error').textContent='Nome o parola chiave non riconosciuti.';return;}
  smoothTo('personal-view','light',function(){showPersonal(matched);});
}

// ===== SLIDESHOW =====
function clearSlideshows(){slideshowTimers.forEach(function(t){clearInterval(t);});slideshowTimers=[];}
function mkSlideshow(photos,name){
  var wrap=document.createElement('div');wrap.className='photo-slideshow';
  var current=0,paused=false,imgs=[],dots=[];
  photos.forEach(function(src,i){var img=document.createElement('img');img.className='photo-slideshow-img';img.src=src;img.alt='';img.onerror=function(){this.style.display='none';};if(i===0)img.classList.add('active');wrap.appendChild(img);imgs.push(img);});
  var openBtn=document.createElement('button');openBtn.className='slideshow-open';openBtn.textContent='⛶ Apri';openBtn.onclick=function(){openLB(photos[current]);};wrap.appendChild(openBtn);
  var dlBtn=document.createElement('button');dlBtn.className='slideshow-dl';dlBtn.textContent='↓ Scarica';dlBtn.onclick=function(){dlImg(photos[current],name+'_foto_'+(current+1));};wrap.appendChild(dlBtn);
  var ctrl=document.createElement('div');ctrl.className='slideshow-controls';
  photos.forEach(function(_,i){var dot=document.createElement('button');dot.className='slideshow-dot'+(i===0?' active':'');dot.onclick=function(){goTo(i);};ctrl.appendChild(dot);dots.push(dot);});
  if(photos.length>1){var pb=document.createElement('button');pb.className='slideshow-pause';pb.textContent='⏸';pb.onclick=function(){paused=!paused;pb.textContent=paused?'▶':'⏸';};ctrl.appendChild(pb);}
  wrap.appendChild(ctrl);
  function goTo(idx){imgs[current].classList.remove('active');dots[current]&&dots[current].classList.remove('active');current=(idx+photos.length)%photos.length;imgs[current].classList.add('active');dots[current]&&dots[current].classList.add('active');}
  if(photos.length>1){var timer=setInterval(function(){if(!paused)goTo(current+1);},3800);slideshowTimers.push(timer);}
  return wrap;
}
function mkSidePhoto(src,name){var item=document.createElement('div');item.className='side-photo-item';var img=document.createElement('img');img.src=src;img.onerror=function(){this.style.opacity='.3';};img.onclick=function(){openLB(src);};var dl=document.createElement('button');dl.className='dl-btn';dl.textContent='↓';dl.onclick=function(e){e.stopPropagation();dlImg(src,name);};item.appendChild(img);item.appendChild(dl);return item;}

  var grp=null;for(var i=0;i<groups.length;i++){if(groups[i].name===friend.group){grp=groups[i];break;}}
  if(!grp)return;
  var members=friends.filter(function(f){return f.group===friend.group;});if(!members.length)return;
  var section=document.createElement('div');section.className='group-section';
  var title=document.createElement('div');title.className='group-section-title';title.textContent=grp.name;section.appendChild(title);
  if(grp.collectiveLetter){var cl=document.createElement('div');cl.className='group-collective-letter';var h3=document.createElement('h3');h3.textContent='Lettera collettiva';var p=document.createElement('p');p.textContent=grp.collectiveLetter;cl.appendChild(h3);cl.appendChild(p);section.appendChild(cl);}
  var list=document.createElement('div');list.className='group-members-list';var myCard=null;
  members.forEach(function(m){var card=document.createElement('div');card.className='group-member-card';if(m.id===friend.id){card.classList.add('highlight');myCard=card;}var nm=document.createElement('div');nm.className='gm-name';nm.textContent=m.name;var pv=document.createElement('div');pv.className='gm-preview';pv.textContent=m.letter?(m.letter.slice(0,120)+'…'):'';card.appendChild(nm);card.appendChild(pv);card.onclick=function(){expandMember(card,m);};list.appendChild(card);});

function newFriend(){editingId=null;currentPhotos=[];['f-name','f-passkey','f-letter'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('f-group').value='';document.getElementById('photo-thumbs').innerHTML='';document.getElementById('btn-del').style.display='none';syncGroupSelect();showTab('form');}
function editFriend(id){var f=null;for(var i=0;i<friends.length;i++){if(friends[i].id===id){f=friends[i];break;}}if(!f)return;editingId=id;currentPhotos=[].concat(f.photos||[]);document.getElementById('f-name').value=f.name;document.getElementById('f-passkey').value=f.passkey||'';document.getElementById('f-letter').value=f.letter||'';syncGroupSelect();document.getElementById('f-group').value=f.group||'';document.getElementById('btn-del').style.display='block';renderThumbs();showTab('form');}
function handlePhotos(input){var files=Array.from(input.files);input.value='';var chain=Promise.resolve();files.forEach(function(file){chain=chain.then(function(){showToast('Caricamento '+file.name+'…');return uploadToCloudinary(file).then(function(url){currentPhotos.push(url);renderThumbs();});});});chain.then(function(){showToast('Foto pronte ✓');}).catch(function(e){showToast('Errore: '+(e.message||e));});}
function renderThumbs(){var c=document.getElementById('photo-thumbs');c.innerHTML='';currentPhotos.forEach(function(src,i){var w=document.createElement('div');w.className='thumb-wrap';var img=document.createElement('img');img.className='photo-thumb';img.src=src;img.onerror=function(){this.style.opacity='.3';};var rm=document.createElement('button');rm.className='rm';rm.textContent='×';rm.onclick=function(){currentPhotos.splice(i,1);renderThumbs();};w.appendChild(img);w.appendChild(rm);c.appendChild(w);});}
function saveFriend(){
  var name=document.getElementById('f-name').value.trim();
  var passkey=document.getElementById('f-passkey').value.trim();
  var letter=document.getElementById('f-letter').value.trim();
  var group=document.getElementById('f-group').value;
  if(!name){showToast('Inserisci un nome!');return;}
  if(!passkey){showToast('Inserisci una parola chiave!');return;}
  var id=editingId||Date.now().toString();
  var entry={id:id,name:name,passkey:passkey,group:group,letter:letter,photos:[].concat(currentPhotos)};
  if(editingId){var idx=-1;for(var i=0;i<friends.length;i++){if(friends[i].id===editingId){idx=i;break;}}if(idx>-1)friends[idx]=entry;else friends.push(entry);}
  else{friends.push(entry);editingId=id;}
  showToast('Salvataggio…');
  saveFriendsGH().then(function(){renderFriendsList();showToast(name+' salvato/a ✓');}).catch(function(e){showToast('Errore: '+(e.message||e));});
}
function deleteFriend(){if(!editingId)return;friends=friends.filter(function(f){return f.id!==editingId;});saveFriendsGH().then(function(){renderFriendsList();showTab('list');editingId=null;showToast('Eliminato');});}
function previewFriend(){showPersonal({id:'preview',name:document.getElementById('f-name').value.trim()||'Anteprima',letter:document.getElementById('f-letter').value.trim(),photos:[].concat(currentPhotos),group:document.getElementById('f-group').value,passkey:'preview'});}

// ===== LIGHTBOX =====
function openLB(src){lbSrc=src;document.getElementById('lb-img').src=src;document.getElementById('lightbox').classList.add('open');}
function closeLB(e){if(!e||e.target===document.getElementById('lightbox')||e.target.classList.contains('lb-close'))document.getElementById('lightbox').classList.remove('open');}
function dlLB(){dlImg(lbSrc,'foto');}
function dlImg(src,name){var a=document.createElement('a');a.href=src;a.download=name||'foto';a.click();}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}

// ===== INIT =====
loadAllData();
</script>
