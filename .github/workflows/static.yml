<script>
// ===== CONFIG — sostituisci GH_TOKEN con il nuovo token dopo aver revocato quello vecchio =====
var ADMIN_PW = 'thesis_2026';
var GH_TOKEN = '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';
var GH_USER  = 'apm1199';
var GH_REPO  = 'thesis-thank-you';
var GH_RAW   = 'https://raw.githubusercontent.com/'+GH_USER+'/'+GH_REPO+'/main/';
var GH_API   = 'https://api.github.com/repos/'+GH_USER+'/'+GH_REPO+'/contents/';

// ===== STATE =====
var friends=[], groups=[], dump=[];
var currentPhotos=[], editingId=null, adminPwVisible=false;
var lbSrc='', totpInterval=null, cloudAnim=null;

// ===== GITHUB HELPERS =====
function ghHeaders(){
  return {Authorization:'token '+GH_TOKEN,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'};
}
// Legge un JSON dal repo
function ghGet(path){
  // Aggiungi cache-busting per evitare dati stantii
  return fetch(GH_API+path+'?t='+Date.now(),{headers:ghHeaders()})
    .then(function(r){
      if(r.status===404) return null;
      return r.json().then(function(j){
        if(!j.content) return null;
        try{return {content:JSON.parse(atob(j.content.replace(/\n/g,''))),sha:j.sha};}
        catch(e){return null;}
      });
    });
}
// Scrive un JSON nel repo
function ghSet(path,data,sha){
  var encoded;
  try{encoded=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));}
  catch(e){encoded=btoa(JSON.stringify(data,null,2));}
  var body={message:'update '+path,content:encoded};
  if(sha) body.sha=sha;
  return fetch(GH_API+path,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)})
    .then(function(r){return r.json();});
}
// Ottieni SHA di un file
function ghGetSha(path){
  return fetch(GH_API+path,{headers:ghHeaders()})
    .then(function(r){
      if(r.status===404) return null;
      return r.json().then(function(j){return j.sha||null;});
    });
}
// Carica immagine grezza (senza prefisso base64)
function ghUploadImg(path,base64full,sha){
  var raw=base64full.indexOf(',')>-1?base64full.split(',')[1]:base64full;
  var body={message:'upload '+path,content:raw};
  if(sha) body.sha=sha;
  return fetch(GH_API+path,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)})
    .then(function(r){return r.json();});
}
function uploadImage(base64full,filename){
  var path='images/'+filename;
  return ghGetSha(path).then(function(sha){
    return ghUploadImg(path,base64full,sha);
  }).then(function(){
    // Restituisce URL raw diretto — funziona sempre senza autenticazione
    return GH_RAW+path;
  });
}
function readFile(file){
  return new Promise(function(res){
    var r=new FileReader();r.onload=function(e){res(e.target.result);};r.readAsDataURL(file);
  });
}
// Salvataggi
function saveFriendsGH(){
  return ghGetSha('data/friends.json').then(function(sha){return ghSet('data/friends.json',friends,sha);});
}
function saveGroupsGH(){
  return ghGetSha('data/groups.json').then(function(sha){return ghSet('data/groups.json',groups,sha);});
}
function saveDumpGH(){
  return ghGetSha('data/dump.json').then(function(sha){return ghSet('data/dump.json',dump,sha);});
}
// Caricamento iniziale
function loadAllData(){
  return Promise.all([
    ghGet('data/friends.json'),
    ghGet('data/groups.json'),
    ghGet('data/dump.json')
  ]).then(function(res){
    friends = res[0]&&res[0].content ? res[0].content : [];
    groups  = res[1]&&res[1].content ? res[1].content : [];
    dump    = res[2]&&res[2].content ? res[2].content : [];
    renderDump();
    document.getElementById('loading-overlay').style.display='none';
  }).catch(function(err){
    console.error('Errore caricamento:',err);
    document.getElementById('loading-overlay').style.display='none';
    showToast('Errore caricamento dati — controlla la connessione');
  });
}

// ===== LASER =====
var LC=document.getElementById('laser-canvas'),lc=LC.getContext('2d');
var lcols=['#ff6ec7','#6ec7ff','#c7ff6e','#ffd06e','#c86eff','#6effcc','#ff6e6e'];
var lasers=[];
function resizeLC(){LC.width=innerWidth;LC.height=innerHeight;}
resizeLC();window.addEventListener('resize',resizeLC);
function mkL(){var h=Math.random()>.5;return{h:h,x:h?0:Math.random()*innerWidth,y:h?Math.random()*innerHeight:0,dx:h?(1+Math.random()*1.5):(Math.random()-.5)*.8,dy:h?(Math.random()-.5)*.8:(1+Math.random()*1.5),len:80+Math.random()*180,col:lcols[Math.floor(Math.random()*lcols.length)],alpha:.25+Math.random()*.45,w:1+Math.random()*2};}
for(var _i=0;_i<22;_i++) lasers.push(mkL());
function animL(){
  lc.clearRect(0,0,LC.width,LC.height);
  lasers.forEach(function(l,i){
    var g=lc.createLinearGradient(l.x,l.y,l.x+(l.h?l.len:0),l.y+(l.h?0:l.len));
    g.addColorStop(0,'transparent');
    g.addColorStop(.5,l.col+Math.floor(l.alpha*255).toString(16).padStart(2,'0'));
    g.addColorStop(1,'transparent');
    lc.strokeStyle=g;lc.lineWidth=l.w;lc.beginPath();lc.moveTo(l.x,l.y);
    lc.lineTo(l.x+(l.h?l.len:0),l.y+(l.h?0:l.len));lc.stroke();
    l.x+=l.dx;l.y+=l.dy;
    if(l.x>innerWidth+l.len||l.y>innerHeight+l.len||l.x<-l.len||l.y<-l.len)lasers[i]=mkL();
  });
  requestAnimationFrame(animL);
}
animL();

// ===== CLOUDS — bianchissime, volumetriche, interattive =====
function startClouds(){
  var cc=document.getElementById('cloud-canvas');
  cc.width=innerWidth;cc.height=innerHeight;
  var ctx=cc.getContext('2d'),t=0,mouse={x:innerWidth/2,y:innerHeight/2};
  document.getElementById('personal-view').addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
  // Nuvole: ogni nuvola è un cluster di bolle sovrapposte
  var clouds=[
    {x:.12,y:.18,scale:1.4,sp:.06,ph:0},
    {x:.55,y:.08,scale:1.8,sp:.05,ph:2.1},
    {x:.82,y:.22,scale:1.2,sp:.07,ph:4.2},
    {x:.25,y:.55,scale:1.6,sp:.055,ph:1.3},
    {x:.68,y:.6,scale:1.3,sp:.065,ph:3.5},
    {x:.05,y:.72,scale:1.1,sp:.08,ph:5.1},
    {x:.45,y:.8,scale:1.5,sp:.05,ph:0.8},
    {x:.88,y:.75,scale:1.2,sp:.07,ph:2.9},
  ];
  // Bolle interne per ogni nuvola (offset relativi)
  var bubbles=[
    {dx:0,dy:0,r:70},{dx:55,dy:-15,r:55},{dx:-50,dy:-10,r:50},
    {dx:25,dy:-40,r:45},{dx:-20,dy:30,r:40},{dx:70,dy:20,r:38},
    {dx:-65,dy:15,r:42},{dx:35,dy:35,r:35}
  ];
  function drawCloud(cx,cy,scale){
    bubbles.forEach(function(b){
      var bx=cx+b.dx*scale,by=cy+b.dy*scale,br=b.r*scale;
      var g=ctx.createRadialGradient(bx-br*.2,by-br*.25,br*.1,bx,by,br);
      g.addColorStop(0,'rgba(255,255,255,0.98)');
      g.addColorStop(0.4,'rgba(248,248,255,0.92)');
      g.addColorStop(0.75,'rgba(230,235,255,0.6)');
      g.addColorStop(1,'rgba(220,225,255,0)');
      ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    });
  }
  function draw(){
    ctx.clearRect(0,0,cc.width,cc.height);
    var W=cc.width,H=cc.height;
    var mx=(mouse.x/W-.5)*30,my=(mouse.y/H-.5)*18;
    clouds.forEach(function(c){
      var cx=W*c.x+Math.sin(t*c.sp+c.ph)*50+mx*0.4;
      var cy=H*c.y+Math.cos(t*c.sp*0.6+c.ph)*22+my*0.2;
      drawCloud(cx,cy,c.scale);
    });
    t+=.005;cloudAnim=requestAnimationFrame(draw);
  }
  draw();
}
function stopClouds(){if(cloudAnim){cancelAnimationFrame(cloudAnim);cloudAnim=null;}var cc=document.getElementById('cloud-canvas');if(cc)cc.getContext('2d').clearRect(0,0,cc.width,cc.height);}

// ===== VORTEX — nomi + lettere che si dissolvono =====
function runVortex(friend){
  var ov=document.getElementById('vortex-overlay'),vc=document.getElementById('vortex-canvas');
  ov.style.display='flex';vc.width=innerWidth;vc.height=innerHeight;
  var ctx=vc.getContext('2d'),W=vc.width,H=vc.height,cx=W/2,cy=H/2;
  // Raccoglie nomi E prime lettere di ogni lettera per più densità
  var tokens=[];
  friends.forEach(function(f){
    if(f.name) tokens.push({text:f.name,isName:true});
    if(f.letter) f.letter.split(/\s+/).slice(0,6).forEach(function(w){if(w.length>2)tokens.push({text:w,isName:false});});
  });
  if(!tokens.length)tokens.push({text:'...',isName:true});
  var particles=tokens.map(function(tok,i){
    return{
      text:tok.text,isName:tok.isName,
      angle:(i/tokens.length)*Math.PI*2+(Math.random()-.5)*.5,
      r:120+Math.random()*180,
      speed:(.008+Math.random()*.012)*(Math.random()>.5?1:-1),
      size:tok.isName?(13+Math.random()*9):(9+Math.random()*5),
      col:lcols[i%lcols.length],
      alpha:.4+Math.random()*.6
    };
  });
  var frame=0,totalFrames=130;
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(10,10,15,0.22)';ctx.fillRect(0,0,W,H);
    var prog=Math.min(frame/90,1);
    particles.forEach(function(p){
      p.angle+=p.speed*(1+prog*4);
      var r=p.r*(1-prog*.97);
      var x=cx+Math.cos(p.angle)*r,y=cy+Math.sin(p.angle)*r;
      ctx.save();
      ctx.globalAlpha=p.alpha*(1-prog*.9);
      ctx.fillStyle=p.isName?p.col:'rgba(255,255,255,0.7)';
      ctx.font=(p.isName?'bold ':'')+Math.max(6,p.size*(1-prog*.6))+'px '+(p.isName?'Georgia':'sans-serif');
      ctx.textAlign='center';ctx.fillText(p.text,x,y);
      ctx.restore();
    });
    // Nome destinatario emerge al centro
    if(prog>.4){
      var a=Math.min((prog-.4)/0.6,1);
      // Alone luminoso
      ctx.save();
      var glow=ctx.createRadialGradient(cx,cy,0,cx,cy,120*a);
      glow.addColorStop(0,'rgba(255,255,255,'+(0.18*a)+')');
      glow.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,120*a,0,Math.PI*2);ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha=a;
      ctx.fillStyle='#fff';
      ctx.font='300 '+Math.floor(22+a*16)+'px Georgia';
      ctx.textAlign='center';ctx.letterSpacing='0.12em';
      ctx.fillText(friend.name.toUpperCase(),cx,cy);
      ctx.restore();
    }
    frame++;
    if(frame<totalFrames){requestAnimationFrame(draw);}
    else{ov.style.display='none';showPersonal(friend);}
  }
  draw();
}

// ===== VIEWS =====
function showView(id){
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  LC.style.display=id==='personal-view'?'none':'block';
  if(id==='personal-view')setTimeout(startClouds,50);else stopClouds();
}

// ===== TOTP =====
function hashStr(s){var h=0;for(var i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return Math.abs(h);}
function makeTOTP(seed){var w=Math.floor(Date.now()/60000);return hashStr(seed+':'+w).toString().slice(0,6).padEnd(6,'0');}
function seedForFriend(f){return(f.authType==='fake'?f.fakeCode:(f.phone||'').replace(/\s/g,''))+':'+f.name.toLowerCase().trim();}

function generateTOTP(){
  var name=document.getElementById('auth-name').value.trim().toLowerCase().replace(/\s+/,' ');
  var phone=document.getElementById('auth-phone').value.trim().replace(/\s/g,'');
  document.getElementById('auth-error').textContent='';
  if(!name||!phone){document.getElementById('auth-error').textContent='Inserisci nome e numero.';return;}
  var friend=null;
  for(var i=0;i<friends.length;i++){
    var f=friends[i];
    if(f.name.toLowerCase().replace(/\s+/,' ').trim()!==name)continue;
    if(f.authType==='fake'&&phone===f.fakeCode){friend=f;break;}
    if(f.authType!=='fake'&&(f.phone||'').replace(/\s/g,'')===phone){friend=f;break;}
  }
  if(!friend){document.getElementById('auth-error').textContent='Dati non riconosciuti.';return;}
  var seed=seedForFriend(friend);
  function upd(){
    document.getElementById('totp-code').textContent=makeTOTP(seed);
    var s=60-Math.floor((Date.now()/1000)%60);
    document.getElementById('timer-bar').style.width=(s/60*100)+'%';
  }
  upd();
  document.getElementById('totp-display').style.display='block';
  if(totpInterval)clearInterval(totpInterval);
  totpInterval=setInterval(upd,1000);
}
function copyTOTP(){
  var code=document.getElementById('totp-code').textContent;
  navigator.clipboard.writeText(code)
    .then(function(){showToast('Codice copiato!');})
    .catch(function(){document.getElementById('paste-input').value=code;showToast('Codice inserito nel box!');});
}

// ===== ACCESS =====
function enterCode(){
  var pasted=document.getElementById('paste-input').value.trim();
  document.getElementById('paste-error').textContent='';
  if(!pasted){document.getElementById('paste-error').textContent='Incolla il tuo codice.';return;}
  var matched=null,w=Math.floor(Date.now()/60000);
  for(var i=0;i<friends.length;i++){
    var seed=seedForFriend(friends[i]);
    for(var d=0;d<=1;d++){
      if(hashStr(seed+':'+(w-d)).toString().slice(0,6).padEnd(6,'0')===pasted){matched=friends[i];break;}
    }
    if(matched)break;
  }
  if(!matched){document.getElementById('paste-error').textContent='Codice non valido o scaduto. Rigeneralo.';return;}
  runVortex(matched);
}

// ===== PERSONAL VIEW =====
function mkImg(src){
  // Aggiunge cache-busting per forzare ricaricamento da GitHub raw
  var url=src+(src.indexOf('?')<0?'?v='+Date.now():'');
  var img=document.createElement('img');
  img.src=url;
  img.onerror=function(){this.src=src;};  // fallback senza cache-busting
  return img;
}
function mkPhotoSlot(src,name){
  var slot=document.createElement('div');slot.className='photo-slot';
  var img=mkImg(src);
  img.onclick=function(){openLB(src);};
  var dl=document.createElement('button');dl.className='dl-btn';dl.textContent='↓';
  dl.onclick=function(e){e.stopPropagation();dlImg(src,name);};
  slot.appendChild(img);slot.appendChild(dl);return slot;
}
function showPersonal(friend){
  document.getElementById('pv-name').textContent=friend.name;
  var cont=document.getElementById('pv-content');cont.innerHTML='';
  var photos=friend.photos||[],letter=friend.letter||'';
  if(photos.length>0&&photos.length<4&&letter){
    var wrap=document.createElement('div');wrap.className='letter-wrap-layout';
    var lDiv=document.createElement('div');lDiv.className='personal-letter';lDiv.textContent=letter;
    var pDiv=document.createElement('div');pDiv.className='wrap-photos';
    photos.forEach(function(src){pDiv.appendChild(mkPhotoSlot(src,friend.name));});
    wrap.appendChild(lDiv);wrap.appendChild(pDiv);cont.appendChild(wrap);
  }else{
    if(letter){var lDiv2=document.createElement('div');lDiv2.className='personal-letter';lDiv2.textContent=letter;cont.appendChild(lDiv2);}
    if(photos.length){var g=document.createElement('div');g.className='photo-gallery';photos.forEach(function(src){g.appendChild(mkPhotoSlot(src,friend.name));});cont.appendChild(g);}
  }
  buildGroupSection(friend);
  showView('personal-view');
  setTimeout(function(){document.querySelector('.personal-scroll').scrollTop=0;},150);
}
function buildGroupSection(friend){
  var gs=document.getElementById('pv-group-section');gs.innerHTML='';
  if(!friend.group)return;
  var grp=null;
  for(var i=0;i<groups.length;i++){if(groups[i].name===friend.group){grp=groups[i];break;}}
  if(!grp)return;
  var members=friends.filter(function(f){return f.group===friend.group;});
  if(!members.length)return;
  var section=document.createElement('div');section.className='group-section';
  var title=document.createElement('div');title.className='group-section-title';title.textContent=grp.name;section.appendChild(title);
  if(grp.collectiveLetter){
    var cl=document.createElement('div');cl.className='group-collective-letter';
    var h3=document.createElement('h3');h3.textContent='Lettera collettiva';
    var p=document.createElement('p');p.textContent=grp.collectiveLetter;
    cl.appendChild(h3);cl.appendChild(p);section.appendChild(cl);
  }
  var list=document.createElement('div');list.className='group-members-list';
  var myCard=null;
  members.forEach(function(m){
    var card=document.createElement('div');card.className='group-member-card';
    if(m.id===friend.id){card.classList.add('highlight');myCard=card;}
    var nameEl=document.createElement('div');nameEl.className='gm-name';nameEl.textContent=m.name;
    var prev=document.createElement('div');prev.className='gm-preview';prev.textContent=m.letter?(m.letter.slice(0,120)+'…'):'';
    card.appendChild(nameEl);card.appendChild(prev);
    card.onclick=function(){expandMember(card,m);};
    list.appendChild(card);
  });
  section.appendChild(list);gs.appendChild(section);
  if(myCard)setTimeout(function(){myCard.scrollIntoView({behavior:'smooth',block:'center'});},400);
}
function expandMember(card,member){
  var ex=card.querySelector('.expanded-member');if(ex){ex.remove();return;}
  document.querySelectorAll('.expanded-member').forEach(function(e){e.remove();});
  var exp=document.createElement('div');exp.className='expanded-member';
  exp.style.cssText='margin-top:.8rem;padding-top:.8rem;border-top:1px solid rgba(0,0,0,.1)';
  if(member.letter){var p=document.createElement('p');p.style.cssText='font-style:italic;font-size:.95rem;line-height:1.8;color:#2a2a2a;white-space:pre-wrap';p.textContent=member.letter;exp.appendChild(p);}
  if((member.photos||[]).length){
    var g=document.createElement('div');g.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:.8rem';
    member.photos.forEach(function(src){g.appendChild(mkPhotoSlot(src,member.name));});exp.appendChild(g);
  }
  card.appendChild(exp);
}

// ===== DUMP =====
function handleDumpUpload(input){
  var files=Array.from(input.files);input.value='';
  var chain=Promise.resolve();
  files.forEach(function(file){
    chain=chain.then(function(){
      showToast('Caricamento '+file.name+'…');
      return readFile(file).then(function(b64){
        var ext=file.name.split('.').pop().toLowerCase();
        var fname='dump_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.'+ext;
        return uploadImage(b64,fname);
      }).then(function(url){
        dump.push(url);renderDump();
      });
    });
  });
  chain.then(function(){return saveDumpGH();})
    .then(function(){showToast('Foto caricate ✓');})
    .catch(function(e){console.error(e);showToast('Errore caricamento foto');});
}
function renderDump(){
  ['dump-grid','dump-grid-admin'].forEach(function(id){
    var g=document.getElementById(id);if(!g)return;g.innerHTML='';
    dump.forEach(function(src,i){
      var item=document.createElement('div');item.className='dump-item';
      var img=mkImg(src);
      img.onclick=function(){openLB(src);};
      var dl=document.createElement('button');dl.className='dl-btn';dl.textContent='↓';
      dl.onclick=function(e){e.stopPropagation();dlImg(src,'foto_'+(i+1));};
      item.appendChild(img);item.appendChild(dl);
      if(id==='dump-grid-admin'){
        var rm=document.createElement('button');rm.className='rm-btn';rm.textContent='×';
        rm.onclick=function(e){e.stopPropagation();dump.splice(i,1);saveDumpGH().then(function(){renderDump();});};
        item.appendChild(rm);
      }
      g.appendChild(item);
    });
  });
}

// ===== GROUPS =====
function syncGroupSelect(){
  var sel=document.getElementById('f-group');if(!sel)return;
  var cur=sel.value;sel.innerHTML='<option value="">Nessun gruppo</option>';
  groups.forEach(function(g){var o=document.createElement('option');o.value=g.name;o.textContent=g.name;sel.appendChild(o);});
  sel.value=cur;
}
function renderGroupsAdmin(){
  var c=document.getElementById('groups-admin-list');c.innerHTML='';
  groups.forEach(function(grp,i){
    var members=friends.filter(function(f){return f.group===grp.name;});
    var card=document.createElement('div');card.className='group-admin-card';
    var hdr=document.createElement('div');hdr.className='ga-header';
    var inp=document.createElement('input');inp.type='text';inp.value=grp.name;inp.placeholder='Nome gruppo';
    inp.oninput=function(e){groups[i].name=e.target.value;syncGroupSelect();};
    var rmBtn=document.createElement('button');rmBtn.className='rm-g';rmBtn.textContent='Elimina';
    rmBtn.onclick=function(){groups.splice(i,1);renderGroupsAdmin();syncGroupSelect();};
    hdr.appendChild(inp);hdr.appendChild(rmBtn);card.appendChild(hdr);
    var lbl=document.createElement('label');lbl.textContent='Lettera collettiva del gruppo';card.appendChild(lbl);
    var ta=document.createElement('textarea');ta.placeholder='Scrivi una lettera per tutto il gruppo...';ta.value=grp.collectiveLetter||'';
    ta.oninput=function(e){groups[i].collectiveLetter=e.target.value;};card.appendChild(ta);
    var tags=document.createElement('div');tags.className='group-members-tags';
    if(members.length){members.forEach(function(m){var s=document.createElement('span');s.className='member-tag';s.textContent=m.name;tags.appendChild(s);});}
    else tags.innerHTML='<span style="font-size:.72rem;color:rgba(255,255,255,.25);font-family:sans-serif">Nessun membro ancora</span>';
    card.appendChild(tags);c.appendChild(card);
  });
}
function addGroup(){groups.push({name:'Nuovo gruppo',collectiveLetter:''});renderGroupsAdmin();syncGroupSelect();}
function saveGroups(){
  saveGroupsGH()
    .then(function(){renderGroupsAdmin();syncGroupSelect();showToast('Gruppi salvati ✓');})
    .catch(function(){showToast('Errore salvataggio gruppi');});
}

// ===== ADMIN =====
function toggleAdminPw(){adminPwVisible=!adminPwVisible;document.getElementById('admin-pw-box').style.display=adminPwVisible?'block':'none';if(adminPwVisible)setTimeout(function(){document.getElementById('admin-pw-input').focus();},50);}
function checkAdmin(){
  if(document.getElementById('admin-pw-input').value===ADMIN_PW){
    document.getElementById('admin-pw-box').style.display='none';adminPwVisible=false;
    showToast('Caricamento dati…');
    loadAllData().then(function(){syncGroupSelect();renderFriendsList();showView('admin-view');});
  }else{
    document.getElementById('admin-pw-input').style.borderColor='#f44';
    setTimeout(function(){document.getElementById('admin-pw-input').style.borderColor='';},900);
  }
}
function showTab(t){
  ['list','form','groups','dump'].forEach(function(id){
    document.getElementById('tab-'+id).style.display=id===t?'block':'none';
    document.getElementById('tb-'+id).classList.toggle('active',id===t);
  });
  if(t==='groups')renderGroupsAdmin();
  if(t==='dump')renderDump();
}
function renderFriendsList(){
  var g=document.getElementById('friends-grid');g.innerHTML='';
  friends.forEach(function(f){
    var c=document.createElement('div');c.className='friend-card';
    c.innerHTML='<div class="fn">'+f.name+'</div><div class="fmeta">'+(f.group||'—')+' · '+(f.photos||[]).length+' foto · '+(f.authType==='fake'?'codice fittizio':'telefono')+'</div>';
    c.onclick=function(){editFriend(f.id);};g.appendChild(c);
  });
}
function updateAuthHint(){
  var t=document.getElementById('f-authtype').value;
  document.getElementById('f-phone-row').style.display=t==='phone'?'block':'none';
  document.getElementById('f-fake-row').style.display=t==='fake'?'block':'none';
  document.getElementById('auth-hint').textContent=t==='phone'?"Il numero reale viene usato per generare il codice":"Iniziali del nome + 'geremias' come identificatore";
  if(t==='fake')updateFakeCode();
}
function updateFakeCode(){
  var n=document.getElementById('f-name').value.trim();
  document.getElementById('f-fake').value=n?n.split(/\s+/).map(function(p){return p[0]||'';}).join('').toUpperCase()+'geremias':'';
}
document.getElementById('f-name').addEventListener('input',function(){if(document.getElementById('f-authtype').value==='fake')updateFakeCode();});

function newFriend(){
  editingId=null;currentPhotos=[];
  ['f-name','f-phone','f-letter'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f-authtype').value='phone';
  document.getElementById('f-group').value='';
  document.getElementById('photo-thumbs').innerHTML='';
  document.getElementById('btn-del').style.display='none';
  updateAuthHint();syncGroupSelect();showTab('form');
}
function editFriend(id){
  var f=null;for(var i=0;i<friends.length;i++){if(friends[i].id===id){f=friends[i];break;}}
  if(!f)return;
  editingId=id;currentPhotos=[].concat(f.photos||[]);
  document.getElementById('f-name').value=f.name;
  document.getElementById('f-phone').value=f.phone||'';
  document.getElementById('f-letter').value=f.letter||'';
  document.getElementById('f-authtype').value=f.authType||'phone';
  syncGroupSelect();document.getElementById('f-group').value=f.group||'';
  document.getElementById('btn-del').style.display='block';
  updateAuthHint();renderThumbs();showTab('form');
}
function handlePhotos(input){
  var files=Array.from(input.files);input.value='';
  var chain=Promise.resolve();
  files.forEach(function(file){
    chain=chain.then(function(){
      showToast('Caricamento '+file.name+'…');
      return readFile(file).then(function(b64){
        var ext=file.name.split('.').pop().toLowerCase();
        var fname='friend_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.'+ext;
        return uploadImage(b64,fname);
      }).then(function(url){
        currentPhotos.push(url);renderThumbs();
      });
    });
  });
  chain.then(function(){showToast('Foto pronte ✓');}).catch(function(){showToast('Errore caricamento foto');});
}
function renderThumbs(){
  var c=document.getElementById('photo-thumbs');c.innerHTML='';
  currentPhotos.forEach(function(src,i){
    var w=document.createElement('div');w.className='thumb-wrap';
    var img=mkImg(src);img.className='photo-thumb';
    var rm=document.createElement('button');rm.className='rm';rm.textContent='×';
    rm.onclick=function(){currentPhotos.splice(i,1);renderThumbs();};
    w.appendChild(img);w.appendChild(rm);c.appendChild(w);
  });
}
function saveFriend(){
  var name=document.getElementById('f-name').value.trim();
  var phone=document.getElementById('f-phone').value.trim();
  var letter=document.getElementById('f-letter').value.trim();
  var authType=document.getElementById('f-authtype').value;
  var group=document.getElementById('f-group').value;
  if(!name){showToast('Inserisci un nome!');return;}
  if(authType==='phone'&&!phone){showToast('Inserisci il numero!');return;}
  var fakeCode=name.split(/\s+/).map(function(p){return p[0]||'';}).join('').toUpperCase()+'geremias';
  // Mantiene l'ID esistente o ne crea uno nuovo
  var id=editingId||Date.now().toString();
  var entry={id:id,name:name,phone:phone,authType:authType,fakeCode:fakeCode,group:group,letter:letter,photos:[].concat(currentPhotos)};
  if(editingId){
    var idx=-1;for(var i=0;i<friends.length;i++){if(friends[i].id===editingId){idx=i;break;}}
    if(idx>-1) friends[idx]=entry; else friends.push(entry);
  } else {
    friends.push(entry);
    editingId=id; // Imposta ID così i salvataggi successivi aggiornano lo stesso profilo
  }
  showToast('Salvataggio…');
  saveFriendsGH()
    .then(function(){
      renderFriendsList();
      showToast(name+' salvato/a ✓');
      // NON resettare il form — l'utente rimane nella scheda di modifica
    })
    .catch(function(){showToast('Errore salvataggio!');});
}
function deleteFriend(){
  if(!editingId)return;
  friends=friends.filter(function(f){return f.id!==editingId;});
  saveFriendsGH().then(function(){renderFriendsList();showTab('list');editingId=null;showToast('Profilo eliminato');});
}
function previewFriend(){
  showPersonal({id:'preview',name:document.getElementById('f-name').value.trim()||'Anteprima',letter:document.getElementById('f-letter').value.trim(),photos:[].concat(currentPhotos),group:document.getElementById('f-group').value,authType:'phone'});
}

// ===== LIGHTBOX =====
function openLB(src){lbSrc=src;document.getElementById('lb-img').src=src;document.getElementById('lightbox').classList.add('open');}
function closeLB(e){if(!e||e.target===document.getElementById('lightbox')||e.target.classList.contains('lb-close'))document.getElementById('lightbox').classList.remove('open');}
function dlLB(){dlImg(lbSrc,'foto');}
function dlImg(src,name){var a=document.createElement('a');a.href=src;a.download=name||'foto';a.click();}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2400);}

// ===== INIT =====
updateAuthHint();
loadAllData();
</script>
</body>
</html>
