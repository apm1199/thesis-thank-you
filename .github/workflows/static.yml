<script>
// ===== CONFIG =====
var ADMIN_PW   = 'thesis_2026';
var GH_TOKEN   = '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';
var GH_USER    = 'apm1199';
var GH_REPO    = 'thesis-thank-you';
var GH_BRANCH  = 'main';
// Raw URL non richiede auth — risolve il CORS per le letture
var GH_RAW     = 'https://raw.githubusercontent.com/'+GH_USER+'/'+GH_REPO+'/'+GH_BRANCH+'/';
var GH_API     = 'https://api.github.com/repos/'+GH_USER+'/'+GH_REPO+'/contents/';

// Cloudinary — upload diretto dal browser (senza auth)
var CLD_CLOUD  = 'democloud';   // ← sostituisci col tuo Cloud Name da Cloudinary dashboard
var CLD_PRESET = 'thesis_upload'; // ← crea un unsigned preset su Cloudinary e metti il nome qui

// ===== STATE =====
var friends=[], groups=[], dump=[];
var currentPhotos=[], editingId=null, adminPwVisible=false;
var lbSrc='', totpInterval=null, cloudAnim=null;

// ===== FETCH CON TIMEOUT =====
function fetchWithTimeout(url,opts,ms){
  ms=ms||12000;
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej(new Error('timeout'));},ms);
    fetch(url,opts||{}).then(function(r){clearTimeout(t);res(r);}).catch(function(e){clearTimeout(t);rej(e);});
  });
}

// ===== GITHUB — lettura via RAW (no CORS issues) =====
function ghRead(path){
  var url=GH_RAW+path+'?cb='+Date.now();
  return fetchWithTimeout(url,{cache:'no-store'})
    .then(function(r){
      if(r.status===404) return null;
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .catch(function(){return null;});
}
// ===== GITHUB — scrittura via API (necessita token) =====
function ghHeaders(){
  return {Authorization:'token '+GH_TOKEN,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'};
}
function ghGetSha(path){
  return fetchWithTimeout(GH_API+path,{headers:ghHeaders()})
    .then(function(r){
      if(r.status===404) return null;
      return r.json().then(function(j){return j.sha||null;});
    })
    .catch(function(){return null;});
}
function ghWrite(path,data,sha){
  var enc;
  try{enc=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));}
  catch(e){enc=btoa(JSON.stringify(data));}
  var body={message:'update '+path,content:enc,branch:GH_BRANCH};
  if(sha) body.sha=sha;
  return fetchWithTimeout(GH_API+path,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)},20000)
    .then(function(r){
      if(!r.ok) return r.json().then(function(j){throw new Error(j.message||'write failed');});
      return r.json();
    });
}
function ghWriteImg(path,b64raw,sha){
  var body={message:'upload '+path,content:b64raw,branch:GH_BRANCH};
  if(sha) body.sha=sha;
  return fetchWithTimeout(GH_API+path,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)},30000)
    .then(function(r){
      if(!r.ok) return r.json().then(function(j){throw new Error(j.message||'upload failed');});
      return r.json();
    });
}
function saveFriendsGH(){return ghGetSha('data/friends.json').then(function(s){return ghWrite('data/friends.json',friends,s);});}
function saveGroupsGH(){return ghGetSha('data/groups.json').then(function(s){return ghWrite('data/groups.json',groups,s);});}
function saveDumpGH(){return ghGetSha('data/dump.json').then(function(s){return ghWrite('data/dump.json',dump,s);});}

function loadAllData(){
  return Promise.all([
    ghRead('data/friends.json'),
    ghRead('data/groups.json'),
    ghRead('data/dump.json')
  ]).then(function(res){
    friends = Array.isArray(res[0]) ? res[0] : [];
    groups  = Array.isArray(res[1]) ? res[1] : [];
    dump    = Array.isArray(res[2]) ? res[2] : [];
    renderDump();
  }).catch(function(err){
    console.warn('loadAllData error:',err);
    showToast('Dati non caricati — controlla connessione');
  });
}

// ===== UPLOAD FOTO — Cloudinary (browser direct) =====
function uploadToCloudinary(file){
  var fd=new FormData();
  fd.append('file',file);
  fd.append('upload_preset',CLD_PRESET);
  return fetchWithTimeout('https://api.cloudinary.com/v1_1/'+CLD_CLOUD+'/image/upload',{method:'POST',body:fd},30000)
    .then(function(r){return r.json();})
    .then(function(j){
      if(j.error) throw new Error(j.error.message);
      return j.secure_url; // URL diretto, funziona sempre
    });
}
// Upload fallback su GitHub se Cloudinary non configurato
function uploadToGH(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(e){
      var b64=e.target.result.split(',')[1];
      var ext=file.name.split('.').pop().toLowerCase();
      var path='images/'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'.'+ext;
      ghGetSha(path).then(function(sha){return ghWriteImg(path,b64,sha);})
        .then(function(){res(GH_RAW+path);}).catch(rej);
    };
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
function uploadFile(file){
  // Se Cloudinary è configurato usa quello, altrimenti GitHub
  if(CLD_CLOUD!=='democloud'&&CLD_PRESET!=='thesis_upload'){
    return uploadToCloudinary(file);
  }
  return uploadToGH(file);
}
function readFile(file){
  return new Promise(function(res){var r=new FileReader();r.onload=function(e){res(e.target.result);};r.readAsDataURL(file);});
}

// ===== LASER =====
var LC=document.getElementById('laser-canvas'),lc=LC.getContext('2d');
var lcols=['#ff6ec7','#6ec7ff','#c7ff6e','#ffd06e','#c86eff','#6effcc','#ff6e6e'];
var lasers=[];
function resizeLC(){LC.width=innerWidth;LC.height=innerHeight;}
resizeLC();window.addEventListener('resize',resizeLC);
function mkL(){var h=Math.random()>.5;return{h:h,x:h?0:Math.random()*innerWidth,y:h?Math.random()*innerHeight:0,dx:h?(1+Math.random()*1.5):(Math.random()-.5)*.8,dy:h?(Math.random()-.5)*.8:(1+Math.random()*1.5),len:80+Math.random()*180,col:lcols[Math.floor(Math.random()*lcols.length)],alpha:.25+Math.random()*.45,w:1+Math.random()*2};}
for(var _i=0;_i<22;_i++) lasers.push(mkL());
function animL(){
  lc.clearRect(0,0,LC.width,LC.height);
  lasers.forEach(function(l,i){
    var g=lc.createLinearGradient(l.x,l.y,l.x+(l.h?l.len:0),l.y+(l.h?0:l.len));
    g.addColorStop(0,'transparent');g.addColorStop(.5,l.col+Math.floor(l.alpha*255).toString(16).padStart(2,'0'));g.addColorStop(1,'transparent');
    lc.strokeStyle=g;lc.lineWidth=l.w;lc.beginPath();lc.moveTo(l.x,l.y);lc.lineTo(l.x+(l.h?l.len:0),l.y+(l.h?0:l.len));lc.stroke();
    l.x+=l.dx;l.y+=l.dy;
    if(l.x>innerWidth+l.len||l.y>innerHeight+l.len||l.x<-l.len||l.y<-l.len)lasers[i]=mkL();
  });
  requestAnimationFrame(animL);
}
animL();

// ===== INTRO ANIMATION =====
var introCanvas=document.getElementById('intro-canvas');
var ic=introCanvas.getContext('2d');
var introParticles=[], introPages=[], introRunning=true, introFrame=0;
var INTRO_DURATION=280; // frames totali (~4.5s a 60fps)
var PHRASES=[
  '"Tutto quello che siamo lo dobbiamo agli altri."',
  '"Il coraggio di un\'amicizia vera è raro quanto il talento."',
  '"Grazie per ogni momento condiviso."',
  '"La distanza non spezza ciò che conta davvero."',
  '"Voi siete parte di questo."'
];

function resizeIntro(){introCanvas.width=innerWidth;introCanvas.height=innerHeight;}
resizeIntro();

// Particelle scintillanti
for(var pi=0;pi<120;pi++){
  introParticles.push({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    size:Math.random()*3+.5,speed:Math.random()*.8+.2,
    col:lcols[Math.floor(Math.random()*lcols.length)],
    phase:Math.random()*Math.PI*2,freq:Math.random()*.05+.02,
    alpha:Math.random()
  });
}
// Pagine di libro
for(var pp=0;pp<5;pp++){
  introPages.push({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    w:180+Math.random()*120,h:220+Math.random()*80,
    rot:(Math.random()-.5)*.6,
    phrase:PHRASES[pp],
    speed:(Math.random()-.5)*.5,
    alpha:0,born:Math.floor(pp*45+20)
  });
}

function drawIntro(){
  if(!introRunning) return;
  var W=introCanvas.width,H=introCanvas.height;
  var prog=Math.min(introFrame/INTRO_DURATION,1);

  // Phase 0→0.4: dark with lasers + particles + pages
  // Phase 0.4→0.7: white flash
  // Phase 0.7→1: sparkles on white, fade out

  var bgLight=prog>0.4?Math.min((prog-0.4)/0.3,1):0;
  var bgCol='rgb('+Math.floor(10+bgLight*245)+','+Math.floor(10+bgLight*245)+','+Math.floor(15+bgLight*240)+')';
  ic.fillStyle=bgCol;
  ic.fillRect(0,0,W,H);

  // Pagine di libro
  if(prog<0.65){
    introPages.forEach(function(pg){
      if(introFrame<pg.born) return;
      var age=introFrame-pg.born;
      pg.alpha=Math.min(age/30,1)*Math.max(0,1-(introFrame-(pg.born+60))/40);
      pg.x+=pg.speed;
      pg.rot+=0.002;
      ic.save();
      ic.translate(pg.x,pg.y);ic.rotate(pg.rot);
      ic.globalAlpha=pg.alpha*(1-bgLight);
      // Pagina
      ic.fillStyle='rgba(255,252,245,0.92)';
      ic.shadowColor='rgba(0,0,0,0.3)';ic.shadowBlur=20;
      ic.beginPath();ic.roundRect(-pg.w/2,-pg.h/2,pg.w,pg.h,4);ic.fill();
      ic.shadowBlur=0;
      // Linee testo simulate
      ic.fillStyle='rgba(80,70,60,0.25)';
      for(var li=0;li<8;li++){ic.fillRect(-pg.w/2+16,(-pg.h/2+30)+li*20,pg.w-32,2);}
      // Frase
      ic.fillStyle='rgba(40,30,20,0.85)';
      ic.font='italic '+(pg.w*.072)+'px Georgia';
      ic.textAlign='center';
      var words=pg.phrase.split(' '),line='',lines=[],maxW=pg.w-32;
      words.forEach(function(w){var t=line?line+' '+w:w;if(ic.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;});
      lines.push(line);
      lines.forEach(function(l,li2){ic.fillText(l,0,-20+(li2-(lines.length-1)/2)*22);});
      ic.restore();
    });
  }

  // Scintillii
  introParticles.forEach(function(p){
    p.phase+=p.freq;
    var a=Math.abs(Math.sin(p.phase))*p.alpha;
    if(bgLight>.3) a*=(1-bgLight+.3); // si dissolvono col bianco
    ic.save();
    ic.globalAlpha=a;
    ic.fillStyle=prog>.5?'rgba(255,220,100,0.9)':p.col;
    ic.beginPath();
    // Stella a 4 punte
    var s=p.size*(prog>.5?1.5:1);
    ic.moveTo(p.x,p.y-s*2);ic.lineTo(p.x+s*.4,p.y-s*.4);
    ic.lineTo(p.x+s*2,p.y);ic.lineTo(p.x+s*.4,p.y+s*.4);
    ic.lineTo(p.x,p.y+s*2);ic.lineTo(p.x-s*.4,p.y+s*.4);
    ic.lineTo(p.x-s*2,p.y);ic.lineTo(p.x-s*.4,p.y-s*.4);
    ic.closePath();ic.fill();
    ic.restore();
  });

  // Luce pura (flash bianco)
  if(bgLight>0){
    ic.fillStyle='rgba(255,255,255,'+Math.min(bgLight*.7,.6)+')';
    ic.fillRect(0,0,W,H);
  }

  // Testo intro
  var tAlpha=Math.min(introFrame/40,1)*Math.max(0,(INTRO_DURATION-introFrame)/40);
  document.getElementById('intro-title').style.opacity=tAlpha;
  document.getElementById('intro-sub').style.opacity=tAlpha*.7;

  introFrame++;
  if(introFrame>=INTRO_DURATION){
    introRunning=false;
    // Dissolvenza uscita
    var intro=document.getElementById('intro-screen');
    intro.style.transition='opacity .8s';
    intro.style.opacity='0';
    setTimeout(function(){intro.style.display='none';},800);
  } else {
    requestAnimationFrame(drawIntro);
  }
}
// Avvia dopo un momento
setTimeout(function(){
  document.getElementById('intro-title').style.opacity='1';
  document.getElementById('intro-sub').style.opacity='.7';
  drawIntro();
},300);

// ===== CLOUDS — volumetriche bianchissime =====
function startClouds(){
  var cc=document.getElementById('cloud-canvas');
  cc.width=innerWidth;cc.height=innerHeight;
  var ctx=cc.getContext('2d'),t=0,mouse={x:innerWidth/2,y:innerHeight/2};
  document.getElementById('personal-view').addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
  var clouds=[
    {x:.10,y:.15,sc:1.5,sp:.055,ph:0},{x:.50,y:.07,sc:1.9,sp:.045,ph:2.1},
    {x:.80,y:.20,sc:1.3,sp:.065,ph:4.2},{x:.22,y:.52,sc:1.7,sp:.05,ph:1.3},
    {x:.65,y:.58,sc:1.4,sp:.06,ph:3.5},{x:.04,y:.70,sc:1.2,sp:.075,ph:5.1},
    {x:.42,y:.78,sc:1.6,sp:.048,ph:0.8},{x:.85,y:.72,sc:1.3,sp:.068,ph:2.9}
  ];
  var bubs=[{dx:0,dy:0,r:65},{dx:52,dy:-14,r:52},{dx:-48,dy:-9,r:48},{dx:24,dy:-38,r:42},{dx:-19,dy:28,r:38},{dx:68,dy:18,r:36},{dx:-62,dy:13,r:40},{dx:33,dy:33,r:33}];
  function drawCloud(cx,cy,sc){
    bubs.forEach(function(b){
      var bx=cx+b.dx*sc,by=cy+b.dy*sc,br=b.r*sc;
      var g=ctx.createRadialGradient(bx-br*.22,by-br*.28,br*.08,bx,by,br);
      g.addColorStop(0,'rgba(255,255,255,0.99)');
      g.addColorStop(.35,'rgba(250,250,255,0.94)');
      g.addColorStop(.7,'rgba(235,238,255,0.55)');
      g.addColorStop(1,'rgba(220,225,255,0)');
      ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    });
  }
  function draw(){
    ctx.clearRect(0,0,cc.width,cc.height);
    var W=cc.width,H=cc.height,mx=(mouse.x/W-.5)*28,my=(mouse.y/H-.5)*16;
    clouds.forEach(function(c){
      var cx=W*c.x+Math.sin(t*c.sp+c.ph)*48+mx*.35;
      var cy=H*c.y+Math.cos(t*c.sp*.65+c.ph)*20+my*.18;
      drawCloud(cx,cy,c.sc);
    });
    t+=.004;cloudAnim=requestAnimationFrame(draw);
  }
  draw();
}
function stopClouds(){if(cloudAnim){cancelAnimationFrame(cloudAnim);cloudAnim=null;}var cc=document.getElementById('cloud-canvas');if(cc)cc.getContext('2d').clearRect(0,0,cc.width,cc.height);}

// ===== VORTEX =====
function runVortex(friend){
  var ov=document.getElementById('vortex-overlay'),vc=document.getElementById('vortex-canvas');
  ov.style.display='block';vc.width=innerWidth;vc.height=innerHeight;
  var ctx=vc.getContext('2d'),W=vc.width,H=vc.height,cx=W/2,cy=H/2;
  var tokens=[];
  friends.forEach(function(f){
    if(f.name) tokens.push({text:f.name,big:true});
    if(f.letter){f.letter.split(/\s+/).slice(0,8).forEach(function(w){if(w.length>2)tokens.push({text:w,big:false});});}
  });
  if(!tokens.length) tokens.push({text:'...',big:true});
  var particles=tokens.map(function(tok,i){
    return{text:tok.text,big:tok.big,angle:(i/tokens.length)*Math.PI*2+(Math.random()-.5)*.8,r:100+Math.random()*200,speed:(.007+Math.random()*.013)*(Math.random()>.5?1:-1),size:tok.big?(14+Math.random()*10):(8+Math.random()*6),col:lcols[i%lcols.length]};
  });
  var frame=0,total=140;
  function draw(){
    ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(10,10,15,.22)';ctx.fillRect(0,0,W,H);
    var prog=Math.min(frame/100,1);
    particles.forEach(function(p){
      p.angle+=p.speed*(1+prog*5);
      var r=p.r*(1-prog*.97),x=cx+Math.cos(p.angle)*r,y=cy+Math.sin(p.angle)*r;
      ctx.save();ctx.globalAlpha=(1-prog*.92);
      ctx.fillStyle=p.big?p.col:'rgba(255,255,255,.75)';
      ctx.font=(p.big?'bold ':'')+Math.max(6,p.size*(1-prog*.65))+'px '+(p.big?'Georgia':'sans-serif');
      ctx.textAlign='center';ctx.fillText(p.text,x,y);ctx.restore();
    });
    if(prog>.35){
      var a=Math.min((prog-.35)/.65,1);
      var glow=ctx.createRadialGradient(cx,cy,0,cx,cy,140*a);
      glow.addColorStop(0,'rgba(255,255,255,'+(0.22*a)+')');glow.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,140*a,0,Math.PI*2);ctx.fill();
      ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#fff';
      ctx.font='200 '+Math.floor(20+a*18)+'px Georgia';ctx.textAlign='center';
      ctx.fillText(friend.name.toUpperCase(),cx,cy);ctx.restore();
    }
    frame++;
    if(frame<total){requestAnimationFrame(draw);}else{ov.style.display='none';showPersonal(friend);}
  }
  draw();
}

