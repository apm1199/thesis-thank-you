<script>
// ===== CONFIG =====
var ADMIN_PW  = 'thesis_2026';
var GH_TOKEN  = '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';
var GH_USER   = 'apm1199';
var GH_REPO   = 'thesis-thank-you';
var GH_BRANCH = 'main';
var GH_RAW    = 'https://raw.githubusercontent.com/'+GH_USER+'/'+GH_REPO+'/'+GH_BRANCH+'/';
var GH_API    = 'https://api.github.com/repos/'+GH_USER+'/'+GH_REPO+'/contents/';
var CLD_CLOUD = 'dypweuagc';
var CLD_PRESET= 'ml_default';

var friends=[], groups=[], dump=[];
var currentPhotos=[], editingId=null, adminPwVisible=false;
var lbSrc='', totpInterval=null, cloudAnim=null;

// ===== GITHUB — lettura via RAW, scrittura via API =====
function ghRead(path){
  return fetch(GH_RAW+path+'?t='+Date.now(),{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .catch(function(){return null;});
}
function ghHeaders(){
  return {Authorization:'token '+GH_TOKEN,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'};
}
function ghGetSha(path){
  return fetch(GH_API+path,{headers:ghHeaders()})
    .then(function(r){return r.status===404?null:r.json().then(function(j){return j.sha||null;});})
    .catch(function(){return null;});
}
function ghWrite(path,data){
  var enc;
  try{enc=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));}
  catch(e){enc=btoa(JSON.stringify(data));}
  return ghGetSha(path).then(function(sha){
    var body={message:'update '+path,content:enc,branch:GH_BRANCH};
    if(sha)body.sha=sha;
    return fetch(GH_API+path,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
  }).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error(t);});
    return r.json();
  });
}
function saveFriendsGH(){return ghWrite('data/friends.json',friends);}
function saveGroupsGH(){return ghWrite('data/groups.json',groups);}
function saveDumpGH(){return ghWrite('data/dump.json',dump);}
function loadAllData(){
  return Promise.all([ghRead('data/friends.json'),ghRead('data/groups.json'),ghRead('data/dump.json')])
    .then(function(res){
      friends=Array.isArray(res[0])?res[0]:[];
      groups=Array.isArray(res[1])?res[1]:[];
      dump=Array.isArray(res[2])?res[2]:[];
      renderDump();
    });
}

// ===== CLOUDINARY =====
function uploadToCloudinary(file){
  var fd=new FormData();
  fd.append('file',file);
  fd.append('upload_preset',CLD_PRESET);
  return fetch('https://api.cloudinary.com/v1_1/'+CLD_CLOUD+'/image/upload',{method:'POST',body:fd})
    .then(function(r){return r.json();})
    .then(function(j){if(j.error)throw new Error(j.error.message);return j.secure_url;});
}

// ===== LASER =====
var LC=document.getElementById('laser-canvas'),lc=LC.getContext('2d');
var lcols=['#ff6ec7','#6ec7ff','#c7ff6e','#ffd06e','#c86eff','#6effcc','#ff6e6e'];
var lasers=[];
function resizeLC(){LC.width=innerWidth;LC.height=innerHeight;}
resizeLC();window.addEventListener('resize',resizeLC);
function mkL(){var h=Math.random()>.5;return{h:h,x:h?0:Math.random()*innerWidth,y:h?Math.random()*innerHeight:0,dx:h?(1+Math.random()*1.5):(Math.random()-.5)*.8,dy:h?(Math.random()-.5)*.8:(1+Math.random()*1.5),len:80+Math.random()*180,col:lcols[Math.floor(Math.random()*lcols.length)],alpha:.25+Math.random()*.45,w:1+Math.random()*2};}
for(var _i=0;_i<22;_i++)lasers.push(mkL());
function animL(){
  lc.clearRect(0,0,LC.width,LC.height);
  lasers.forEach(function(l,i){
    var g=lc.createLinearGradient(l.x,l.y,l.x+(l.h?l.len:0),l.y+(l.h?0:l.len));
    g.addColorStop(0,'transparent');g.addColorStop(.5,l.col+Math.floor(l.alpha*255).toString(16).padStart(2,'0'));g.addColorStop(1,'transparent');
    lc.strokeStyle=g;lc.lineWidth=l.w;lc.beginPath();lc.moveTo(l.x,l.y);lc.lineTo(l.x+(l.h?l.len:0),l.y+(l.h?0:l.len));lc.stroke();
    l.x+=l.dx;l.y+=l.dy;
    if(l.x>innerWidth+l.len||l.y>innerHeight+l.len||l.x<-l.len||l.y<-l.len)lasers[i]=mkL();
  });
  requestAnimationFrame(animL);
}
animL();

// ===== NUVOLE =====
function startClouds(){
  var cc=document.getElementById('cloud-canvas');
  cc.width=innerWidth;cc.height=innerHeight;
  var ctx=cc.getContext('2d'),t=0;
  var mouse={x:innerWidth/2,y:innerHeight/2};
  var pv=document.getElementById('personal-view');
  function onMove(e){var s=e.touches?e.touches[0]:e;mouse.x=s.clientX;mouse.y=s.clientY;}
  pv.addEventListener('mousemove',onMove);
  pv.addEventListener('touchmove',onMove,{passive:true});
  var clouds=[
    {bx:.08,by:.12,sc:1.6,sp:.04,ph:0},{bx:.45,by:.06,sc:2.0,sp:.035,ph:2.0},
    {bx:.78,by:.18,sc:1.4,sp:.05,ph:4.1},{bx:.18,by:.48,sc:1.8,sp:.038,ph:1.2},
    {bx:.62,by:.54,sc:1.5,sp:.045,ph:3.4},{bx:.03,by:.68,sc:1.3,sp:.055,ph:5.0},
    {bx:.38,by:.76,sc:1.7,sp:.037,ph:0.7},{bx:.82,by:.70,sc:1.4,sp:.052,ph:2.8}
  ];
  var sph=[
    {dx:0,dy:0,r:60},{dx:48,dy:-12,r:50},{dx:-44,dy:-8,r:46},
    {dx:22,dy:-36,r:40},{dx:-17,dy:26,r:36},{dx:65,dy:16,r:34},
    {dx:-58,dy:12,r:38},{dx:30,dy:30,r:30},{dx:-30,dy:-30,r:28}
  ];
  function drawCloud(cx,cy,sc){
    sph.forEach(function(s){
      var bx=cx+s.dx*sc,by=cy+s.dy*sc,br=s.r*sc;
      var g=ctx.createRadialGradient(bx-br*.25,by-br*.3,br*.05,bx,by,br);
      g.addColorStop(0,'rgba(255,255,255,1.0)');
      g.addColorStop(.3,'rgba(252,252,255,0.96)');
      g.addColorStop(.65,'rgba(240,243,255,0.6)');
      g.addColorStop(1,'rgba(225,230,255,0)');
      ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    });
  }
  function draw(){
    ctx.clearRect(0,0,cc.width,cc.height);
    var W=cc.width,H=cc.height;
    var mx=(mouse.x/W-.5)*25,my=(mouse.y/H-.5)*14;
    clouds.forEach(function(c){
      var cx=W*c.bx+Math.sin(t*c.sp+c.ph)*52+mx*.3;
      var cy=H*c.by+Math.cos(t*c.sp*.6+c.ph)*22+my*.15;
      drawCloud(cx,cy,c.sc);
    });
    t+=.003;cloudAnim=requestAnimationFrame(draw);
  }
  draw();
}
function stopClouds(){
  if(cloudAnim){cancelAnimationFrame(cloudAnim);cloudAnim=null;}
  var cc=document.getElementById('cloud-canvas');
  if(cc)cc.getContext('2d').clearRect(0,0,cc.width,cc.height);
}

// ===== TRANSIZIONI =====
// type: 'light' = bagliore bianco (→ pagina personale)
//       'dark'  = dissolvenza scura (→ admin / indietro)
function smoothTo(targetId,type,afterFn){
  var ov=document.createElement('div');
  ov.className='t-overlay';
  ov.style.background=type==='light'?'#fff':'#0a0a0f';
  document.body.appendChild(ov);

  if(type==='light'){
    // Canvas raggi di luce
    var rc=document.createElement('canvas');
    rc.style.cssText='position:absolute;inset:0;width:100%;height:100%';
    ov.appendChild(rc);
    rc.width=innerWidth;rc.height=innerHeight;
    var rctx=rc.getContext('2d');
    var cx2=innerWidth/2,cy2=innerHeight/2,fr=0;
    var ri=setInterval(function(){
      rctx.clearRect(0,0,rc.width,rc.height);
      var p=Math.min(fr/20,1);
      for(var r=0;r<24;r++){
        var ang=(r/24)*Math.PI*2+fr*.015;
        var len=p*Math.min(innerWidth,innerHeight)*.55;
        var grd=rctx.createLinearGradient(cx2,cy2,cx2+Math.cos(ang)*len,cy2+Math.sin(ang)*len);
        grd.addColorStop(0,'rgba(255,240,180,'+(0.6*p)+')');
        grd.addColorStop(1,'rgba(255,255,255,0)');
        rctx.beginPath();
        rctx.moveTo(cx2,cy2);
        rctx.lineTo(cx2+Math.cos(ang-.04)*len,cy2+Math.sin(ang-.04)*len);
        rctx.lineTo(cx2+Math.cos(ang+.04)*len,cy2+Math.sin(ang+.04)*len);
        rctx.closePath();rctx.fillStyle=grd;rctx.fill();
      }
      var gl=rctx.createRadialGradient(cx2,cy2,0,cx2,cy2,160*p);
      gl.addColorStop(0,'rgba(255,250,200,'+(0.95*p)+')');
      gl.addColorStop(.5,'rgba(255,255,220,'+(0.4*p)+')');
      gl.addColorStop(1,'rgba(255,255,255,0)');
      rctx.beginPath();rctx.arc(cx2,cy2,160*p,0,Math.PI*2);rctx.fillStyle=gl;rctx.fill();
      fr++;
    },16);
    setTimeout(function(){clearInterval(ri);},600);
  }

  // Fade in overlay
  requestAnimationFrame(function(){requestAnimationFrame(function(){ov.style.opacity='1';});});

  // Al picco esegui azione
  setTimeout(function(){
    if(afterFn)afterFn();
    else showView(targetId);
    // Fade out
    setTimeout(function(){
      ov.style.opacity='0';
      setTimeout(function(){if(ov.parentNode)ov.parentNode.removeChild(ov);},550);
    },type==='light'?200:100);
  },480);
}

// ===== VIEWS =====
function showView(id){
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  LC.style.display=id==='personal-view'?'none':'block';
  if(id==='personal-view')setTimeout(startClouds,60);else stopClouds();
}

// ===== TOTP =====
function hashStr(s){var h=0;for(var i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return Math.abs(h);}
function makeTOTP(seed){var w=Math.floor(Date.now()/60000);return hashStr(seed+':'+w).toString().slice(0,6).padEnd(6,'0');}
function seedForFriend(f){return(f.authType==='fake'?f.fakeCode:(f.phone||'').replace(/\s/g,''))+':'+f.name.toLowerCase().trim();}

function generateTOTP(){
  var name=document.getElementById('auth-name').value.trim().toLowerCase().replace(/\s+/,' ');
  var phone=document.getElementById('auth-phone').value.trim().replace(/\s/g,'');
  document.getElementById('auth-error').textContent='';
  if(!name||!phone){document.getElementById('auth-error').textContent='Inserisci nome e numero.';return;}
  var found=null;
  for(var i=0;i<friends.length;i++){
    var f=friends[i];
    if(f.name.toLowerCase().replace(/\s+/,' ').trim()!==name)continue;
    if(f.authType==='fake'&&phone===f.fakeCode){found=f;break;}
    if(f.authType!=='fake'&&(f.phone||'').replace(/\s/g,'')===phone){found=f;break;}
  }
  if(!found){document.getElementById('auth-error').textContent='Dati non riconosciuti.';return;}
  var seed=seedForFriend(found);
  function upd(){document.getElementById('totp-code').textContent=makeTOTP(seed);var s=60-Math.floor((Date.now()/1000)%60);document.getElementById('timer-bar').style.width=(s/60*100)+'%';}
  upd();document.getElementById('totp-display').style.display='block';
  if(totpInterval)clearInterval(totpInterval);totpInterval=setInterval(upd,1000);
}
function copyTOTP(){
  var code=document.getElementById('totp-code').textContent;
  navigator.clipboard.writeText(code).then(function(){showToast('Codice copiato!');}).catch(function(){document.getElementById('paste-input').value=code;showToast('Codice inserito nel box!');});
}

// ===== ACCESSO =====
function enterCode(){
  var pasted=document.getElementById('paste-input').value.trim();
  document.getElementById('paste-error').textContent='';
  if(!pasted){document.getElementById('paste-error').textContent='Incolla il tuo codice.';return;}
  var matched=null,w=Math.floor(Date.now()/60000);
  for(var i=0;i<friends.length;i++){
    var seed=seedForFriend(friends[i]);
    for(var d=0;d<=1;d++){if(hashStr(seed+':'+(w-d)).toString().slice(0,6).padEnd(6,'0')===pasted){matched=friends[i];break;}}
    if(matched)break;
  }
  if(!matched){document.getElementById('paste-error').textContent='Codice non valido o scaduto. Rigeneralo.';return;}
  // Transizione luce → pagina personale
  smoothTo('personal-view','light',function(){showPersonal(matched);});
}

// ===== PERSONAL VIEW =====
function showPersonal(friend){
  document.getElementById('pv-name').textContent=friend.name;
  var cont=document.getElementById('pv-content');cont.innerHTML='';
  var photos=friend.photos||[],letter=friend.letter||'';
  if(photos.length>0&&photos.length<4&&letter){
    var wrap=document.createElement('div');wrap.className='letter-side-layout';
    var lDiv=document.createElement('div');lDiv.className='personal-letter';lDiv.textContent=letter;
    var pCol=document.createElement('div');pCol.className='side-photos';
    photos.forEach(function(src){pCol.appendChild(mkSidePhoto(src,friend.name));});
    wrap.appendChild(lDiv);wrap.appendChild(pCol);cont.appendChild(wrap);
  } else {
    if(letter){var lDiv2=document.createElement('div');lDiv2.className='personal-letter';lDiv2.textContent=letter;cont.appendChild(lDiv2);}
    if(photos.length){
      var cw=document.createElement('div');cw.className='photo-carousel-wrap';
      var car=document.createElement('div');car.className='photo-carousel';
      photos.forEach(function(src){car.appendChild(mkCarouselItem(src,friend.name));});
      cw.appendChild(car);cont.appendChild(cw);
    }
  }
  buildGroupSection(friend);
  showView('personal-view');
  setTimeout(function(){var ps=document.querySelector('.personal-scroll');if(ps)ps.scrollTop=0;},80);
}
function mkSidePhoto(src,name){
  var item=document.createElement('div');item.className='side-photo-item';
  var img=document.createElement('img');img.src=src;img.onerror=function(){this.style.opacity='.3';};
  img.onclick=function(){openLB(src);};
  var dl=document.createElement('button');dl.className='dl-btn';dl.textContent='↓';dl.onclick=function(e){e.stopPropagation();dlImg(src,name);};
  item.appendChild(img);item.appendChild(dl);return item;
}
function mkCarouselItem(src,name){
  var item=document.createElement('div');item.className='photo-carousel-item';
  var img=document.createElement('img');img.src=src;img.onerror=function(){this.style.opacity='.3';};
  img.onclick=function(){openLB(src);};
  var dl=document.createElement('button');dl.className='dl-btn';dl.textContent='↓';dl.onclick=function(e){e.stopPropagation();dlImg(src,name);};
  item.appendChild(img);item.appendChild(dl);return item;
}
function buildGroupSection(friend){
  var gs=document.getElementById('pv-group-section');gs.innerHTML='';
  if(!friend.group)return;
  var grp=null;for(var i=0;i<groups.length;i++){if(groups[i].name===friend.group){grp=groups[i];break;}}
  if(!grp)return;
  var members=friends.filter(function(f){return f.group===friend.group;});
  if(!members.length)return;
  var section=document.createElement('div');section.className='group-section';
  var title=document.createElement('div');title.className='group-section-title';title.textContent=grp.name;section.appendChild(title);
  if(grp.collectiveLetter){
    var cl=document.createElement('div');cl.className='group-collective-letter';
    var h3=document.createElement('h3');h3.textContent='Lettera collettiva';
    var p=document.createElement('p');p.textContent=grp.collectiveLetter;
    cl.appendChild(h3);cl.appendChild(p);section.appendChild(cl);
  }
  var list=document.createElement('div');list.className='group-members-list';var myCard=null;
  members.forEach(function(m){
    var card=document.createElement('div');card.className='group-member-card';
    if(m.id===friend.id){card.classList.add('highlight');myCard=card;}
    var nm=document.createElement('div');nm.className='gm-name';nm.textContent=m.name;
    var pv=document.createElement('div');pv.className='gm-preview';pv.textContent=m.letter?(m.letter.slice(0,120)+'…'):'';
    card.appendChild(nm);card.appendChild(pv);
    card.onclick=function(){expandMember(card,m);};
    list.appendChild(card);
  });
  section.appendChild(list);gs.appendChild(section);
  if(myCard)setTimeout(function(){myCard.scrollIntoView({behavior:'smooth',block:'center'});},400);
}
function expandMember(card,member){
  var ex=card.querySelector('.expanded-member');if(ex){ex.remove();return;}
  document.querySelectorAll('.expanded-member').forEach(function(e){e.remove();});
  var exp=document.createElement('div');exp.className='expanded-member';exp.style.cssText='margin-top:.8rem;padding-top:.8rem;border-top:1px solid rgba(0,0,0,.1)';
  if(member.letter){var p=document.createElement('p');p.style.cssText='font-style:italic;font-size:.95rem;line-height:1.8;color:#2a2a2a;white-space:pre-wrap';p.textContent=member.letter;exp.appendChild(p);}
  if((member.photos||[]).length){
    var car=document.createElement('div');car.className='photo-carousel';car.style.marginTop='.8rem';
    member.photos.forEach(function(src){car.appendChild(mkCarouselItem(src,member.name));});exp.appendChild(car);
  }
  card.appendChild(exp);
}

// ===== DUMP =====
function handleDumpUpload(input){
  var files=Array.from(input.files);input.value='';
  var chain=Promise.resolve();
  files.forEach(function(file){
    chain=chain.then(function(){
      showToast('Caricamento '+file.name+'…');
      return uploadToCloudinary(file).then(function(url){dump.push(url);renderDump();});
    });
  });
  chain.then(function(){return saveDumpGH();}).then(function(){showToast('Foto caricate ✓');}).catch(function(e){showToast('Errore: '+(e.message||e));});
}
function renderDump(){
  ['dump-grid','dump-grid-admin'].forEach(function(id){
    var g=document.getElementById(id);if(!g)return;g.innerHTML='';
    dump.forEach(function(src,i){
      var item=document.createElement('div');item.className='dump-item';
      var img=document.createElement('img');img.src=src;img.onerror=function(){this.style.opacity='.3';};
      img.onclick=function(){openLB(src);};
      var dl=document.createElement('button');dl.className='dl-btn';dl.textContent='↓';dl.onclick=function(e){e.stopPropagation();dlImg(src,'foto_'+(i+1));};
      item.appendChild(img);item.appendChild(dl);
      if(id==='dump-grid-admin'){
        var rm=document.createElement('button');rm.className='rm-btn';rm.textContent='×';
        rm.onclick=function(e){e.stopPropagation();dump.splice(i,1);saveDumpGH().then(renderDump);};
        item.appendChild(rm);
      }
      g.appendChild(item);
    });
  });
}

// ===== GRUPPI =====
function syncGroupSelect(){
  var sel=document.getElementById('f-group');if(!sel)return;
  var cur=sel.value;sel.innerHTML='<option value="">Nessun gruppo</option>';
  groups.forEach(function(g){var o=document.createElement('option');o.value=g.name;o.textContent=g.name;sel.appendChild(o);});
  sel.value=cur;
}
function renderGroupsAdmin(){
  var c=document.getElementById('groups-admin-list');c.innerHTML='';
  groups.forEach(function(grp,i){
    var members=friends.filter(function(f){return f.group===grp.name;});
    var card=document.createElement('div');card.className='group-admin-card';
    var hdr=document.createElement('div');hdr.className='ga-header';
    var inp=document.createElement('input');inp.type='text';inp.value=grp.name;inp.placeholder='Nome gruppo';
    inp.oninput=function(e){groups[i].name=e.target.value;syncGroupSelect();};
    var rm=document.createElement('button');rm.className='rm-g';rm.textContent='Elimina';
    rm.onclick=function(){groups.splice(i,1);renderGroupsAdmin();syncGroupSelect();};
    hdr.appendChild(inp);hdr.appendChild(rm);card.appendChild(hdr);
    var lbl=document.createElement('label');lbl.textContent='Lettera collettiva del gruppo';card.appendChild(lbl);
    var ta=document.createElement('textarea');ta.placeholder='Scrivi per tutto il gruppo...';ta.value=grp.collectiveLetter||'';
    ta.oninput=function(e){groups[i].collectiveLetter=e.target.value;};card.appendChild(ta);
    var tags=document.createElement('div');tags.className='group-members-tags';
    if(members.length){members.forEach(function(m){var s=document.createElement('span');s.className='member-tag';s.textContent=m.name;tags.appendChild(s);});}
    else tags.innerHTML='<span style="font-size:.72rem;color:rgba(255,255,255,.22);font-family:sans-serif">Nessun membro</span>';
    card.appendChild(tags);c.appendChild(card);
  });
}
function addGroup(){groups.push({name:'Nuovo gruppo',collectiveLetter:''});renderGroupsAdmin();syncGroupSelect();}
function saveGroups(){
  saveGroupsGH().then(function(){renderGroupsAdmin();syncGroupSelect();showToast('Gruppi salvati ✓');}).catch(function(e){showToast('Errore: '+(e.message||e));});
}

// ===== ADMIN =====
function toggleAdminPw(){
  adminPwVisible=!adminPwVisible;
  document.getElementById('admin-pw-box').style.display=adminPwVisible?'block':'none';
  if(adminPwVisible)setTimeout(function(){document.getElementById('admin-pw-input').focus();},50);
}
function checkAdmin(){
  if(document.getElementById('admin-pw-input').value===ADMIN_PW){
    document.getElementById('admin-pw-box').style.display='none';
    adminPwVisible=false;
    showToast('Caricamento dati…');
    loadAllData().then(function(){
      syncGroupSelect();
      renderFriendsList();
      // Transizione smooth scura verso admin
      smoothTo('admin-view','dark');
    }).catch(function(e){showToast('Errore: '+(e.message||e));});
  } else {
    document.getElementById('admin-pw-input').style.borderColor='#f44';
    setTimeout(function(){document.getElementById('admin-pw-input').style.borderColor='';},900);
  }
}
function showTab(t){
  ['list','form','groups','dump'].forEach(function(id){
    document.getElementById('tab-'+id).style.display=id===t?'block':'none';
    document.getElementById('tb-'+id) && document.getElementById('tb-'+id).classList.toggle('active',id===t);
  });
  if(t==='groups')renderGroupsAdmin();
  if(t==='dump')renderDump();
}
function renderFriendsList(){
  var g=document.getElementById('friends-grid');g.innerHTML='';
  friends.forEach(function(f){
    var c=document.createElement('div');c.className='friend-card';
    c.innerHTML='<div class="fn">'+f.name+'</div><div class="fmeta">'+(f.group||'—')+' · '+(f.photos||[]).length+' foto · '+(f.authType==='fake'?'fittizio':'telefono')+'</div>';
    c.onclick=function(){editFriend(f.id);};g.appendChild(c);
  });
}
function updateAuthHint(){
  var t=document.getElementById('f-authtype').value;
  document.getElementById('f-phone-row').style.display=t==='phone'?'block':'none';
  document.getElementById('f-fake-row').style.display=t==='fake'?'block':'none';
  document.getElementById('auth-hint').textContent=t==='phone'?'Numero reale per generare il codice':'Iniziali+geremias come identificatore';
  if(t==='fake')updateFakeCode();
}
function updateFakeCode(){
  var n=document.getElementById('f-name').value.trim();
  document.getElementById('f-fake').value=n?n.split(/\s+/).map(function(p){return p[0]||'';}).join('').toUpperCase()+'geremias':'';
}
document.getElementById('f-name').addEventListener('input',function(){if(document.getElementById('f-authtype').value==='fake')updateFakeCode();});

function newFriend(){
  editingId=null;currentPhotos=[];
  ['f-name','f-phone','f-letter'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f-authtype').value='phone';document.getElementById('f-group').value='';
  document.getElementById('photo-thumbs').innerHTML='';document.getElementById('btn-del').style.display='none';
  updateAuthHint();syncGroupSelect();showTab('form');
}
function editFriend(id){
  var f=null;for(var i=0;i<friends.length;i++){if(friends[i].id===id){f=friends[i];break;}}if(!f)return;
  editingId=id;currentPhotos=[].concat(f.photos||[]);
  document.getElementById('f-name').value=f.name;
  document.getElementById('f-phone').value=f.phone||'';
  document.getElementById('f-letter').value=f.letter||'';
  document.getElementById('f-authtype').value=f.authType||'phone';
  syncGroupSelect();document.getElementById('f-group').value=f.group||'';
  document.getElementById('btn-del').style.display='block';
  updateAuthHint();renderThumbs();showTab('form');
}
function handlePhotos(input){
  var files=Array.from(input.files);input.value='';
  var chain=Promise.resolve();
  files.forEach(function(file){
    chain=chain.then(function(){
      showToast('Caricamento '+file.name+'…');
      return uploadToCloudinary(file).then(function(url){currentPhotos.push(url);renderThumbs();});
    });
  });
  chain.then(function(){showToast('Foto pronte ✓');}).catch(function(e){showToast('Errore: '+(e.message||e));});
}
function renderThumbs(){
  var c=document.getElementById('photo-thumbs');c.innerHTML='';
  currentPhotos.forEach(function(src,i){
    var w=document.createElement('div');w.className='thumb-wrap';
    var img=document.createElement('img');img.className='photo-thumb';img.src=src;img.onerror=function(){this.style.opacity='.3';};
    var rm=document.createElement('button');rm.className='rm';rm.textContent='×';rm.onclick=function(){currentPhotos.splice(i,1);renderThumbs();};
    w.appendChild(img);w.appendChild(rm);c.appendChild(w);
  });
}
function saveFriend(){
  var name=document.getElementById('f-name').value.trim();
  var phone=document.getElementById('f-phone').value.trim();
  var letter=document.getElementById('f-letter').value.trim();
  var authType=document.getElementById('f-authtype').value;
  var group=document.getElementById('f-group').value;
  if(!name){showToast('Inserisci un nome!');return;}
  if(authType==='phone'&&!phone){showToast('Inserisci il numero!');return;}
  var fakeCode=name.split(/\s+/).map(function(p){return p[0]||'';}).join('').toUpperCase()+'geremias';
  var id=editingId||Date.now().toString();
  var entry={id:id,name:name,phone:phone,authType:authType,fakeCode:fakeCode,group:group,letter:letter,photos:[].concat(currentPhotos)};
  if(editingId){var idx=-1;for(var i=0;i<friends.length;i++){if(friends[i].id===editingId){idx=i;break;}}if(idx>-1)friends[idx]=entry;else friends.push(entry);}
  else{friends.push(entry);editingId=id;}
  showToast('Salvataggio…');
  saveFriendsGH()
    .then(function(){renderFriendsList();showToast(name+' salvato/a ✓');})
    .catch(function(e){showToast('Errore salvataggio: '+(e.message||e));});
}
function deleteFriend(){
  if(!editingId)return;
  friends=friends.filter(function(f){return f.id!==editingId;});
  saveFriendsGH().then(function(){renderFriendsList();showTab('list');editingId=null;showToast('Eliminato');});
}
function previewFriend(){
  showPersonal({id:'preview',name:document.getElementById('f-name').value.trim()||'Anteprima',letter:document.getElementById('f-letter').value.trim(),photos:[].concat(currentPhotos),group:document.getElementById('f-group').value,authType:'phone'});
}

// ===== LIGHTBOX =====
function openLB(src){lbSrc=src;document.getElementById('lb-img').src=src;document.getElementById('lightbox').classList.add('open');}
function closeLB(e){if(!e||e.target===document.getElementById('lightbox')||e.target.classList.contains('lb-close'))document.getElementById('lightbox').classList.remove('open');}
function dlLB(){dlImg(lbSrc,'foto');}
function dlImg(src,name){var a=document.createElement('a');a.href=src;a.download=name||'foto';a.click();}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}

// ===== INIT =====
updateAuthHint();
loadAllData();
</script>
</body>
</html>
